name: Tests

# Раньше 366 тестов проекта гонялись только руками локально — сломанный
# код мог случайно уехать в прод (Railway деплоит main напрямую), никто
# не узнавал об этом до жалоб пользователей. Теперь pytest гоняется
# автоматически на каждый push и pull request.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest -q

      - name: Audit dependencies for known CVEs
        run: pip-audit -r requirements.txt
