<!DOCTYPE html>
<html lang="ru">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,600,1,0">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:FILL@1">

<title>Project ADAM</title>

<link rel="stylesheet" href="/static/style.css?v=1003">
</head>
<body>

<div id="app">

<header class="player-card">
<div class="adam-avatar-wrap" id="adamAvatarWrap"><div class="adam-avatar" id="adamAvatar">A</div></div>
<div class="player-card__ring-wrap">

<svg class="level-ring" viewBox="0 0 120 120">

<defs>
<linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" stop-color="#FFD76A"></stop>
<stop offset="100%" stop-color="#F0B429"></stop>
</linearGradient>
</defs>

<circle class="level-ring__track"
cx="60"
cy="60"
r="52"></circle>

<circle class="level-ring__fill"
id="levelRingFill"
cx="60"
cy="60"
r="52"></circle>

</svg>

<div class="level-ring__badge">

<span id="levelNumber">1</span>
<small>LVL</small>

</div>

</div>

<div class="player-card__info">

<div class="player-card__name">

<span id="playerName">👋 Добро пожаловать</span><span id="playerBadge" class="player-badge" style="display:none">🏅</span>

</div>

<div class="player-card__stats">

<div class="stat stat--coin">
    <span class="material-symbols-rounded stat-icon">diamond</span>
    <span id="coinValue">0</span>
</div>

<div class="stat stat--streak">
    <span class="material-symbols-rounded stat-icon">local_fire_department</span>
    <span id="streakValue">0</span>
</div>

</div>

<div class="xp-bar">

<div class="xp-bar__fill" id="xpBarFill"
style="width:0%">
</div>

</div>

<div class="xp-bar__label" id="xpLabel">

0 / 100 XP

</div>

</div>

</header>

<main id="content">

<!-- ===================== HOME ===================== -->
<section class="tab-panel" data-tab="home">

<div class="section-heading">

<h2>Сегодня</h2>

<span class="section-heading__sub" id="habitsProgressLabel">

0/0 сегодня

</span>

</div>



<div class="plan-card">

  <div class="section-heading">

    <h2>План дня</h2>

    <span class="section-heading__sub" id="planProgressLabel">

      0/0

    </span>

  </div>

  <div class="plan-main">

    <div class="plan-main__label">🎯 Главная задача</div>

    <input id="mainGoalInput" type="text" placeholder="Главная задача дня">

  </div>

  <div class="plan-tasks">

    <input class="plan-task-input" placeholder="2 задача">
    <input class="plan-task-input" placeholder="3 задача">

  </div>

  <button class="btn plan-save-btn" id="savePlanBtn">

    Сохранить план

  </button>

  <form class="add-form plan-add-form" id="addPlanTaskForm">

  <input
  type="text"
  id="newPlanTaskInput"
  placeholder="Новая задача..."
  >

  <button
  type="submit"
  class="btn btn--accent plan-add-form__btn">

  Добавить новую задачу

  </button>

  </form>

  <ul class="plan-list" id="planList"></ul>

</div>

<ul class="habit-list" id="habitList">
</ul>

<form class="add-form" id="addHabitForm">

<input
type="text"
id="newHabitInput"
placeholder="Новая привычка..."
>

<input type="time" id="newHabitTime" aria-label="Время привычки" title="Когда выполнять">

<button
type="submit"
class="btn btn--accent">

+

</button>

</form>

</section>

<!-- ===================== CALENDAR ===================== -->
<section class="tab-panel" data-tab="calendar" hidden>

<div class="section-heading">

<h2>Календарь</h2>

</div>

<div class="calendar-grid" id="calendarGrid">
</div>

</section>

<!-- ===================== RATING ===================== -->
<section class="tab-panel" data-tab="rating" hidden>

<div class="section-heading">

<h2>Рейтинг</h2>

</div>

<ul class="rating-list" id="ratingList">
</ul>

</section>

<!-- ===================== PROFILE ===================== -->
<section class="tab-panel" data-tab="profile" hidden>
