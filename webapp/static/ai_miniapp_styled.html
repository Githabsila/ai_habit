    <style>
    :root{
        --bg:#07040E;
        --surface: rgba(18,14,28,.72);
        --surface-light: rgba(255,255,255,.06);
        --border: rgba(255,255,255,.08);
        --text:#FFFFFF;
        --text-muted:#9D9DB3;
        --primary:#7C5CFC;
        --primary-dark:#6D28D9;
        --gold:#FFD54F;
        --gold-dark:#F0B429;
       --red:#EF4444;
        --radius:24px;
        --primary-light:#A78BFA;
        --tg-safe-top: 0px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body, #root { width: 100%; height: 100%; }

    body {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        color: var(--text);
        background:
            radial-gradient(circle at 20% 0%, rgba(124,92,252,.22), transparent 38%),
            radial-gradient(circle at 100% 10%, rgba(240,180,41,.12), transparent 32%),
            radial-gradient(circle at 50% 100%, rgba(255,106,77,.10), transparent 40%),
            var(--bg);
        -webkit-tap-highlight-color: transparent;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
    }

    /* HEADER */
    .header {
        position: sticky;
        top: 0;
        z-index: 20;
        padding: 14px 18px 16px;
        padding-top: calc(14px + var(--tg-safe-top));
        box-shadow: 0 12px 32px rgba(0,0,0,.35);
        background: var(--surface);
        backdrop-filter: blur(22px);
        -webkit-backdrop-filter: blur(22px);
        border-bottom: 1px solid var(--border);
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .header-title {
        display: flex;
        align-items: center;
        gap: 14px;
        font-family: 'Space Grotesk', sans-serif;
        font-size: 18px;
        font-weight: 700;
    }

    .header-title-icon {
        width: 44px;
        height: 44px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 22px;
        border-radius: 16px;
        background: linear-gradient(135deg, var(--primary), var(--primary-dark));
        box-shadow: 0 8px 20px rgba(124,92,252,.4), inset 0 1px 0 rgba(255,255,255,.15);
    }

    .quota-badge{font-size:11px;color:var(--gold);margin-top:3px}
    .quota-panel{
        margin-top:8px;
        padding:10px 11px;
        border:1px solid rgba(139,92,246,.22);
        background:linear-gradient(145deg,rgba(139,92,246,.13),rgba(255,255,255,.035));
        border-radius:13px;
        font-size:10px;
        line-height:1.35;
        box-shadow:inset 0 1px rgba(255,255,255,.05);
    }
    .quota-panel--pro{
        border-color:rgba(255,213,79,.22);
        background:linear-gradient(145deg,rgba(255,213,79,.11),rgba(139,92,246,.06));
    }
    .quota-panel__title{display:flex;align-items:center;gap:6px}
    .quota-panel__title strong{font-size:12px;letter-spacing:.04em;color:#fff}
    .quota-panel__spark{color:#FFD54F;font-size:13px}
    .quota-panel__subtitle{margin-top:2px;color:#A9A8BA;font-size:9px}
    .quota-panel__count{margin-top:7px;color:#D4D2DE;font-size:10px}
    .quota-panel__count b{color:#fff;font-size:12px}
    .quota-panel .quota-action{display:inline-block;color:#A78BFA;margin-top:4px;font-size:9px}
    .header-status {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 12px;
        font-weight: 500;
        color: var(--text-muted);
        margin-top: 2px;
    }

    .status-dot {
        width: 7px;
        height: 7px;
        background: var(--gold);
        border-radius: 50%;
        box-shadow: 0 0 6px rgba(255,213,79,.9);
        animation: pulse 2s infinite;
    }

    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }

    .header-buttons { display: flex; gap: 8px; }

    .icon-btn {
        width: 40px;
        height: 40px;
        border: 1px solid var(--border);
        background: rgba(255,213,79,.08);
        color: var(--gold);
        border-radius: 14px;
        cursor: pointer;
        font-size: 18px;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all .2s ease;
    }

    .icon-btn:hover {
        background: rgba(255,213,79,.18);
        border-color: rgba(255,213,79,.4);
        transform: scale(1.06);
    }

    /* MESSAGES */
    .messages-container {
        flex: 1;
        overflow-y: auto;
        padding: 20px 16px;
        display: flex;
        flex-direction: column;
        gap: 14px;
    }

    .messages-container::-webkit-scrollbar { width: 4px; }
    .messages-container::-webkit-scrollbar-track { background: transparent; }
    .messages-container::-webkit-scrollbar-thumb {
        background: linear-gradient(var(--primary), var(--gold));
        border-radius: 2px;
    }

    .empty-state {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100%;
        gap: 18px;
        text-align: center;
    }

    .empty-icon {
        width: 84px;
        height: 84px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 40px;
        border-radius: 28px;
        background: linear-gradient(135deg, var(--primary), var(--primary-dark));
        box-shadow: 0 16px 40px rgba(124,92,252,.4), inset 0 1px 0 rgba(255,255,255,.15);
    }

    .empty-text {
        color: var(--text-muted);
        font-size: 14px;
        line-height: 1.6;
        max-width: 260px;
    }

    .message { display: flex; animation: slideIn .3s ease-out; word-wrap: break-word; }

    @keyframes slideIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .message.user { justify-content: flex-end; }
    .message.assistant { justify-content: flex-start; }

    .message-bubble {
        /* Промт п.9: расширено, чтобы длинные ответы Адама помещались
           полностью и не выглядели обрезанными по ширине. */
        max-width: 92%;
        padding: 13px 17px;
        border-radius: var(--radius);
        font-size: 14px;
        line-height: 1.5;
        white-space: pre-wrap;
    }

    .message.user .message-bubble {
        background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
        color: #fff;
        border-radius: 20px 6px 20px 20px;
        box-shadow: 0 10px 28px rgba(124,92,252,.35);
    }

    .message.assistant .message-bubble {
        background: var(--surface-light);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        color: #e8e8f0;
        border: 1px solid var(--border);
        border-radius: 6px 20px 20px 20px;
    }

    .message-time { font-size: 11px; color: var(--text-muted); margin-top: 5px; }

    .thinking {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 13px 17px;
        background: var(--surface-light);
        border-radius: 6px 20px 20px 20px;
        border: 1px solid var(--border);
        font-size: 13px;
        color: var(--text-muted);
    }

    .spinner {
        width: 13px;
        height: 13px;
        border: 2px solid rgba(124,92,252,.25);
        border-top-color: var(--primary);
        border-radius: 50%;
        animation: spin .8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* FEEDBACK & ACTIONS */
    .message-actions { display: flex; gap: 8px; margin-top: 10px; }

    .action-btn {
        padding: 7px 12px;
        font-size: 12px;
        font-weight: 500;
        border: 1px solid var(--border);
        background: var(--surface-light);
        color: var(--text-muted);
        border-radius: 10px;
        cursor: pointer;
        transition: all .2s ease;
    }

    .action-btn:hover {
        border-color: var(--primary);
        color: var(--primary-light, #A78BFA);
        background: rgba(124,92,252,.12);
    }

    .habit-suggestion {
        position: relative;
        overflow: hidden;
        background: var(--surface-light);
        backdrop-filter: blur(16px);
        padding: 12px 14px;
        border-radius: 16px;
        border: 1px solid rgba(255,213,79,.25);
        margin-top: 10px;
        font-size: 13px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
    }

    .habit-suggestion::before {
        content: "";
        position: absolute;
        left: 0; top: 0; bottom: 0;
        width: 3px;
        background: linear-gradient(var(--gold), var(--gold-dark));
    }

    .add-habit-btn {
        padding: 6px 12px;
        background: linear-gradient(135deg, #FFD76A, var(--gold-dark));
        color: #201703;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        font-weight: 700;
        font-size: 12px;
        box-shadow: 0 6px 16px rgba(240,180,41,.35);
        transition: transform .15s ease;
    }

    .add-habit-btn:hover { transform: scale(1.05); }

    /* INPUT AREA */
    .input-area {
        padding: 14px 16px;
        background: var(--surface);
        backdrop-filter: blur(22px);
        -webkit-backdrop-filter: blur(22px);
        border-top: 1px solid var(--border);
        display: flex;
        gap: 10px;
        align-items: flex-end;
    }

    .input-wrapper {
        flex: 1;
        display: flex;
        align-items: center;
        background: var(--surface-light);
        border: 1px solid var(--border);
        border-radius: 22px;
        padding: 10px 18px;
        transition: all .2s ease;
    }

    .input-wrapper:focus-within {
        border-color: var(--primary);
        box-shadow: 0 0 0 3px rgba(124,92,252,.15);
    }

    .input-wrapper textarea {
        flex: 1;
        background: transparent;
        border: none;
        color: var(--text);
        font-size: 14px;
        font-family: 'Inter', sans-serif;
        resize: none;
        /* Промт п.9: поле ввода расширено по высоте, чтобы длинный текст
           не обрезался и был виден целиком при наборе. */
        min-height: 22px;
        max-height: 180px;
        outline: none;
    }

    .input-wrapper textarea::placeholder { color: var(--text-muted); }

    .send-btn {
        width: 44px;
        height: 44px;
        border: none;
        background: linear-gradient(135deg, #FFD76A, var(--gold-dark));
        color: #201703;
        border-radius: 16px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 18px;
        font-weight: 700;
        box-shadow: 0 10px 24px rgba(240,180,41,.35), inset 0 1px 0 rgba(255,255,255,.4);
        transition: all .2s ease;
        flex-shrink: 0;
    }

    .send-btn:hover:not(:disabled) { transform: scale(1.06); }
    .send-btn:active:not(:disabled) { transform: scale(.94); }
    .send-btn:disabled { opacity: .4; cursor: not-allowed; box-shadow: none; }

    /* ALERTS */
    .throttle-warning {
        background: rgba(255,213,79,.1);
        border: 1px solid rgba(255,213,79,.3);
        color: var(--gold);
        padding: 11px 16px;
        border-radius: 14px;
        font-size: 13px;
        text-align: center;
        margin-bottom: 8px;
    }

    .crisis-alert {
        background: rgba(239,68,68,.12);
        border: 1px solid rgba(239,68,68,.35);
        color: #FF8080;
        padding: 12px;
        border-radius: 14px;
        margin-bottom: 6px;
        font-weight: 600;
        font-size: 13px;
    }

    @media (max-width: 600px) {
        .message-bubble { max-width: 90%; }
    }

/* PERFORMANCE PASS 28.08 — было: отключали стеклянный блюр на ЛЮБОМ
   экране уже с 600px, то есть буквально на всех телефонах — включая
   мощные, для которых blur не проблема. Экран узкий ≠ слабое железо
   (iPhone Pro тоже <600px). Решение о производительности принимает
   .performance-lite ниже (реальная проверка hardwareConcurrency /
   deviceMemory / saveData), а не ширина вьюпорта. */
@media (prefers-reduced-motion: no-preference){
  .app-performance-paused *,.app-performance-paused *::before,.app-performance-paused *::after{
    animation-play-state:paused!important;
  }
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important;}
}

/* PERFORMANCE LITE — keep the chat responsive on weaker phones. */
.performance-lite .header,.performance-lite .chat-toolbar,.performance-lite .quick-prompts,.performance-lite .message-mini-actions button,.performance-lite .input-area,.performance-lite .emoji-panel,.performance-lite .input-row,.performance-lite .message-bubble{backdrop-filter:none!important;-webkit-backdrop-filter:none!important}
.performance-lite body::before,.performance-lite .header-title-icon::after,.performance-lite .adam-spark,.performance-lite .composer-glow{animation:none!important;display:none!important}
.performance-lite .message{animation:none!important}
.performance-lite .typing-shimmer{animation:none!important;color:inherit}
.performance-lite .message-bubble{box-shadow:0 8px 22px rgba(0,0,0,.14)!important}
.performance-lite .header,.performance-lite .input-area{box-shadow:0 10px 28px rgba(0,0,0,.18)!important}

/* =========================================================
   ADAM ULTRA CHAT — emoji + motion + micro-interactions
   ========================================================= */
:root{--adam-glow:rgba(139,108,255,.42);--adam-gold-glow:rgba(255,217,120,.28)}
body{overscroll-behavior:none}
.app-container{position:relative;isolation:isolate}
.app-container>*{position:relative;z-index:1}
.app-container:before{content:"";position:fixed;inset:-35%;z-index:-2;pointer-events:none;
 background:conic-gradient(from 120deg at 50% 50%,rgba(124,92,252,.09),transparent 20%,rgba(255,213,79,.06),transparent 44%,rgba(124,92,252,.08),transparent 70%);
 animation:adamOrbit 22s linear infinite}
@keyframes adamOrbit{to{transform:rotate(360deg)}}
.header{box-shadow:0 10px 40px rgba(0,0,0,.32),inset 0 -1px rgba(255,255,255,.04)}
.header-title-icon{position:relative;overflow:visible}
.header-title-icon:after{content:"";position:absolute;inset:-5px;border-radius:20px;border:1px solid rgba(167,139,250,.18);animation:adamRing 2.8s ease-in-out infinite}
@keyframes adamRing{50%{transform:scale(1.08);opacity:.35}100%{transform:scale(1);opacity:.8}}
.message{animation:adamMessage .42s cubic-bezier(.2,.8,.2,1);transform-origin:bottom}
@keyframes adamMessage{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
.message-bubble{position:relative;overflow:hidden}
.message.user .message-bubble{transition:transform .2s ease,box-shadow .2s ease}
.message.user .message-bubble:active{transform:scale(.985)}
.message.assistant .message-bubble{transition:transform .2s ease,border-color .2s ease}
.message.assistant .message-bubble:hover{border-color:rgba(201,188,255,.24);transform:translateY(-1px)}
.message-bubble::selection{background:rgba(167,139,250,.35)}
.emoji-launcher{width:44px;height:44px;flex:0 0 44px;border-radius:15px;border:1px solid rgba(255,255,255,.09);background:linear-gradient(145deg,rgba(255,255,255,.07),rgba(139,108,255,.08));color:#E8E2F5;font-size:19px;cursor:pointer;transition:.2s;box-shadow:inset 0 1px rgba(255,255,255,.07)}
.emoji-launcher:hover{transform:translateY(-2px) scale(1.03);border-color:rgba(201,188,255,.25);box-shadow:0 8px 24px rgba(0,0,0,.18)}
.emoji-panel{position:absolute;left:10px;right:10px;bottom:78px;padding:12px;border:1px solid rgba(201,188,255,.15);border-radius:20px;background:rgba(18,14,29,.94);backdrop-filter:blur(24px);box-shadow:0 24px 60px rgba(0,0,0,.45),inset 0 1px rgba(255,255,255,.08);z-index:30;animation:emojiIn .22s cubic-bezier(.2,.8,.2,1)}
@keyframes emojiIn{from{opacity:0;transform:translateY(10px) scale(.97)}to{opacity:1;transform:none}}
.emoji-tabs{display:flex;gap:5px;margin-bottom:8px;overflow:auto}
.emoji-tab{border:0;background:transparent;color:#858093;border-radius:10px;padding:6px 8px;font-size:12px;cursor:pointer}
.emoji-tab.active{background:rgba(139,108,255,.16);color:#D9D0FF}
.emoji-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:3px;max-height:190px;overflow:auto}
.emoji-grid button{border:0;background:transparent;border-radius:10px;padding:7px 0;font-size:22px;cursor:pointer;transition:.15s}
.emoji-grid button:hover{background:rgba(255,255,255,.07);transform:scale(1.18)}
.composer-row{position:relative}
.composer-glow{position:absolute;inset:-1px;border-radius:22px;pointer-events:none;opacity:0;transition:opacity .2s;box-shadow:0 0 0 1px rgba(139,108,255,.18),0 0 30px rgba(139,108,255,.08)}
.input-row:focus-within .composer-glow{opacity:1}
.send-btn{transition:transform .18s ease,box-shadow .18s ease,filter .18s ease}
.send-btn:not(:disabled):hover{transform:translateY(-2px) scale(1.04);box-shadow:0 12px 30px rgba(92,59,210,.38);filter:saturate(1.15)}
.send-btn:not(:disabled):active{transform:scale(.94)}
.reaction-row{display:flex;gap:5px;margin-top:8px;opacity:.9}
.reaction-btn{border:1px solid rgba(255,255,255,.07);background:rgba(255,255,255,.035);color:#A7A0B5;border-radius:12px;padding:5px 8px;font-size:12px;cursor:pointer;transition:.18s}
.reaction-btn:hover,.reaction-btn.active{background:rgba(139,108,255,.12);border-color:rgba(201,188,255,.18);transform:translateY(-1px)}
.adam-toast{position:fixed;left:50%;bottom:92px;transform:translate(-50%,12px);opacity:0;pointer-events:none;padding:10px 14px;border-radius:14px;background:rgba(28,22,43,.94);border:1px solid rgba(201,188,255,.16);box-shadow:0 15px 40px rgba(0,0,0,.35);color:#F1ECFA;font-size:12px;font-weight:700;z-index:100;transition:.25s}
.adam-toast.show{opacity:1;transform:translate(-50%,0)}
.adam-spark{position:fixed;width:5px;height:5px;border-radius:50%;background:#C9BCFF;pointer-events:none;z-index:80;animation:sparkFly .8s ease-out forwards}
@keyframes sparkFly{to{transform:translate(var(--dx),var(--dy)) scale(0);opacity:0}}
.typing-shimmer{background:linear-gradient(90deg,#A9A3B7 20%,#fff 40%,#A9A3B7 60%);background-size:200% auto;color:transparent;background-clip:text;animation:shimmer 1.4s linear infinite}
@keyframes shimmer{to{background-position:-200% center}}
@media(max-width:430px){.emoji-grid{grid-template-columns:repeat(7,1fr)}.emoji-panel{bottom:72px}.emoji-launcher{width:42px;height:42px;flex-basis:42px}}
@media(prefers-reduced-motion:reduce){.app-container:before,.header-title-icon:after,.message,.adam-spark,.typing-shimmer{animation:none!important}}

/* Лента сообщений: последнее сообщение у низа, когда переписка короткая
   (spacer-блок в JS перед сообщениями забирает всё свободное место через
   flex-grow), а когда сообщений много и лента не помещается — обычный
   скролл как везде. ВАЖНО: не через justify-content:flex-end — в паре
   с overflow-y:auto это в части WebView вообще блокирует скролл
   (известный баг флексбокса), поэтому именно flex-grow на отдельном
   элементе, а не justify-content на самом скролл-контейнере.
   overscroll-behavior — чтобы нельзя было "утянуть" резиновым скроллом
   ниже последнего сообщения; листать вверх по уже открытой истории
   при этом работает как обычно, это не трогает. */
.messages-container{
 overscroll-behavior-y:contain !important;
