    <style>
    :root{
        --bg:#07040E;
        --surface: rgba(18,14,28,.72);
        --surface-light: rgba(255,255,255,.06);
        --border: rgba(255,255,255,.08);
        --text:#FFFFFF;
        --text-muted:#9D9DB3;
        --primary:#7C5CFC;
        --primary-dark:#6D28D9;
        --gold:#FFD54F;
        --gold-dark:#F0B429;
       --red:#EF4444;
        --radius:24px;
        --primary-light:#A78BFA;
        --tg-safe-top: 0px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body, #root { width: 100%; height: 100%; }

    body {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        color: var(--text);
        background:
            radial-gradient(circle at 20% 0%, rgba(124,92,252,.22), transparent 38%),
            radial-gradient(circle at 100% 10%, rgba(240,180,41,.12), transparent 32%),
            radial-gradient(circle at 50% 100%, rgba(255,106,77,.10), transparent 40%),
            var(--bg);
        -webkit-tap-highlight-color: transparent;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
    }

    /* HEADER */
    .header {
        position: sticky;
        top: 0;
        z-index: 20;
        padding: 14px 18px 16px;
        padding-top: calc(14px + var(--tg-safe-top));
        box-shadow: 0 12px 32px rgba(0,0,0,.35);
        background: var(--surface);
        backdrop-filter: blur(22px);
        -webkit-backdrop-filter: blur(22px);
        border-bottom: 1px solid var(--border);
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .header-title {
        display: flex;
        align-items: center;
        gap: 14px;
        font-family: 'Space Grotesk', sans-serif;
        font-size: 18px;
        font-weight: 700;
    }

    .header-title-icon {
        width: 44px;
        height: 44px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 22px;
        border-radius: 16px;
        background: linear-gradient(135deg, var(--primary), var(--primary-dark));
        box-shadow: 0 8px 20px rgba(124,92,252,.4), inset 0 1px 0 rgba(255,255,255,.15);
    }

    .premium-icon{
        font-family:'Material Symbols Rounded';
        font-weight:600;
        font-style:normal;
        font-size:20px;
        line-height:1;
        letter-spacing:normal;
        text-transform:none;
        display:inline-flex;
        align-items:center;
        justify-content:center;
        white-space:nowrap;
        direction:ltr;
        -webkit-font-feature-settings:'liga';
        -webkit-font-smoothing:antialiased;
        font-feature-settings:'liga';
    }
    .quick-prompts .premium-icon,.welcome-prompts .premium-icon{font-size:19px;color:#D8CEFF;}
    .action-btn .premium-icon{font-size:17px;vertical-align:-4px;margin-right:4px;}
    .icon-btn .premium-icon{font-size:21px;}
    .voice-btn .premium-icon{font-size:22px;}
    .error-card .premium-icon,.crisis-alert .premium-icon,.throttle-warning .premium-icon{margin-right:5px;color:#FFD76A;}
    .quota-badge{font-size:11px;color:var(--gold);margin-top:3px}
    .quota-panel{
        margin-top:8px;
        padding:10px 11px;
        border:1px solid rgba(139,92,246,.22);
        background:linear-gradient(145deg,rgba(139,92,246,.13),rgba(255,255,255,.035));
        border-radius:13px;
        font-size:10px;
        line-height:1.35;
        box-shadow:inset 0 1px rgba(255,255,255,.05);
    }
    .quota-panel--pro{
        border-color:rgba(255,213,79,.22);
        background:linear-gradient(145deg,rgba(255,213,79,.11),rgba(139,92,246,.06));
    }
    .quota-panel__title{display:flex;align-items:center;gap:6px}
    .quota-panel__title strong{font-size:12px;letter-spacing:.04em;color:#fff}
    .quota-panel__spark{color:#FFD54F;font-size:13px}
    .quota-panel__subtitle{margin-top:2px;color:#A9A8BA;font-size:9px}
    .quota-panel__count{margin-top:7px;color:#D4D2DE;font-size:10px}
    .quota-panel__count b{color:#fff;font-size:12px}
    .quota-panel .quota-action{display:inline-block;color:#A78BFA;margin-top:4px;font-size:9px}
    .header-status {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 12px;
        font-weight: 500;
        color: var(--text-muted);

    .status-dot {
        width: 7px;
        height: 7px;

    .header-buttons { display: flex; gap: 8px; }

    .icon-btn {

    .icon-btn:hover {

    }

    /* MESSAGES */
    .messages-container {

        overflow-y: auto;
        padding: 20px 16px;

        flex-direction: column;
        gap: 14px;

    .messages-container::-webkit-scrollbar { width: 4px; }
    .messages-container::-webkit-scrollbar-track { background: transparent; }
    .messages-container::-webkit-scrollbar-thumb {

        border-radius: 2px;
    }

    .empty-state {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100%;
        gap: 18px;

    .empty-icon {

    .empty-text {

        line-height: 1.6;

    .message { display: flex; animation: slideIn .3s ease-out; word-wrap: break-word; }

    @keyframes slideIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .message.user { justify-content: flex-end; }
    .message.assistant { justify-content: flex-start; }

    .message-bubble {
        /* Промт п.9: расширено, чтобы длинные ответы Адама помещались

        line-height: 1.5;

        border-radius: 20px 6px 20px 20px;

    .message.assistant .message-bubble {

        border-radius: 6px 20px 20px 20px;
        border: 1px solid var(--border);

        color: var(--text-muted);

    .spinner {
        width: 13px;
        height: 13px;
        border: 2px solid rgba(124,92,252,.25);
        border-top-color: var(--primary);
        border-radius: 50%;
        animation: spin .8s linear infinite;

    @keyframes spin { to { transform: rotate(360deg); } }

    /* FEEDBACK & ACTIONS */
    .message-actions { display: flex; gap: 8px; margin-top: 10px; }

    .action-btn {
        padding: 7px 12px;

    .action-btn:hover {

    .habit-suggestion {

    .habit-suggestion::before {

        left: 0; top: 0; bottom: 0;
        width: 3px;
        background: linear-gradient(var(--gold), var(--gold-dark));

    .add-habit-btn {

    /* INPUT AREA */
    .input-area {
        padding: 14px 16px;
        background: var(--surface);
        backdrop-filter: blur(22px);
        -webkit-backdrop-filter: blur(22px);
        border-top: 1px solid var(--border);
        display: flex;
        gap: 10px;
        align-items: flex-end;

    .input-wrapper {
        flex: 1;
        display: flex;
        align-items: center;
        background: var(--surface-light);
        border: 1px solid var(--border);
        border-radius: 22px;
        padding: 10px 18px;
        transition: all .2s ease;
    }

    .input-wrapper:focus-within {
        border-color: var(--primary);
        box-shadow: 0 0 0 3px rgba(124,92,252,.15);

    .input-wrapper textarea {
        flex: 1;
        background: transparent;
        border: none;
        color: var(--text);
        font-size: 14px;
        font-family: 'Inter', sans-serif;
        resize: none;
        /* Промт п.9: поле ввода расширено по высоте, чтобы длинный текст

        min-height: 22px;
        max-height: 180px;

    .input-wrapper textarea::placeholder { color: var(--text-muted); }

    .send-btn {
        width: 44px;

        border: none;

        font-weight: 700;

    .send-btn:disabled { opacity: .4; cursor: not-allowed; box-shadow: none; }

        color: #FF8080;
        padding: 12px;
        border-radius: 14px;
        margin-bottom: 6px;
        font-weight: 600;
        font-size: 13px;
    }

    @media (max-width: 600px) {
        .message-bubble { max-width: 90%; }
    }

<body>
    <div id="root"></div>

   <script type="text/babel">
    const { useState, useEffect, useRef, useCallback } = React;

        const tg = window.Telegram.WebApp;
        tg.ready();
        try { tg.expand(); } catch (e) {}
        try { tg.setHeaderColor('#07040E'); tg.setBackgroundColor('#07040E'); } catch (e) {}

        function applySafeArea() {
            const top = (tg.contentSafeAreaInset && tg.contentSafeAreaInset.top || 0)
                      + (tg.safeAreaInset && tg.safeAreaInset.top || 0);
            document.documentElement.style.setProperty('--tg-safe-top', top + 'px');
        }
        applySafeArea();
        try {
            tg.onEvent('safeAreaChanged', applySafeArea);
            tg.onEvent('contentSafeAreaChanged', applySafeArea);
        } catch (e) {}

        function goHome() {
            try { tg.HapticFeedback.impactOccurred('light'); } catch (e) {}
            window.location.href = '/';
        }

        // Нативная кнопка "назад" Telegram — тоже ведёт в главное меню
        try {
            tg.BackButton.show();
            tg.onEvent('backButtonClicked', goHome);
        } catch (e) {}

        // Ключ в sessionStorage: живёт, пока не закрыта сама мини-апп (вкладка/
        // WebView), и переживает переход "назад в меню -> снова в наставника"
        // внутри одной открытой сессии. Полное закрытие мини-аппы уничтожает
        // sessionStorage сам по себе — отдельно чистить ничего не нужно.
        const CHAT_STORAGE_KEY = 'adam_chat_history';

        function loadStoredMessages() {
            try {
                const raw = sessionStorage.getItem(CHAT_STORAGE_KEY);
                return raw ? JSON.parse(raw) : [];
            } catch (e) {
                return [];
            }
        }

        function saveStoredMessages(messages) {
            try {
                sessionStorage.setItem(CHAT_STORAGE_KEY, JSON.stringify(messages));
            } catch (e) {}
        }

        function formatTime(value) {
            if (!value) return new Date().toLocaleTimeString('ru', {hour:'2-digit', minute:'2-digit'});
            const d = new Date(String(value).replace(' ', 'T') + (String(value).includes('Z') ? '' : 'Z'));
            return isNaN(d.getTime()) ? String(value).slice(-5) : d.toLocaleTimeString('ru', {hour:'2-digit', minute:'2-digit'});
        }

        function vibrate(type='light') {
            try { tg.HapticFeedback.impactOccurred(type); } catch(e) {}
        }

        function AiChat() {
            const [messages, setMessages] = useState(loadStoredMessages);
            const [input, setInput] = useState('');
            const [loading, setLoading] = useState(false);
            const [throttle, setThrottle] = useState(null);
            const [quota, setQuota] = useState(null);
            const [listening, setListening] = useState(false);
            const [showTools, setShowTools] = useState(false);
            const [copiedId, setCopiedId] = useState(null);
            const [online, setOnline] = useState(navigator.onLine);
            const messagesEnd = useRef(null);
            const textareaRef = useRef(null);
            const recognitionRef = useRef(null);

            const scroll = (behavior='smooth') => messagesEnd.current?.scrollIntoView({behavior, block:'end'});
            useEffect(() => { scroll('auto'); }, []);
            useEffect(() => { saveStoredMessages(messages); scroll(); }, [messages]);

            const loadHistory = useCallback(async () => {
                try {
                    const res = await fetch('/api/ai/history?init_data=' + encodeURIComponent(tg.initData) + '&limit=80');
                    if (!res.ok) return;
                    const data = await res.json();
                    if (!Array.isArray(data.history)) return;
                    const normalized = data.history.map((m, i) => ({
                        id: m.id || `history-${i}`,
                        role: m.role === 'assistant' ? 'assistant' : 'user',
                        text: m.message || '',
                        time: formatTime(m.timestamp || m.created_at),
                        canRate: m.role === 'assistant'
                    }));
                    if (normalized.length) setMessages(normalized);
                } catch(e) {}
            }, []);

            useEffect(() => {
                fetch('/api/ai/quota', {headers:{'X-Telegram-Init-Data':tg.initData}})
                    .then(r=>r.json()).then(setQuota).catch(()=>{});
                if (!loadStoredMessages().length) loadHistory();
                const onOnline=()=>setOnline(true), onOffline=()=>setOnline(false);
                window.addEventListener('online',onOnline); window.addEventListener('offline',onOffline);
                return ()=>{ window.removeEventListener('online',onOnline); window.removeEventListener('offline',onOffline); };
            }, [loadHistory]);

            const resizeInput = () => {
                const el=textareaRef.current; if (!el) return;
                el.style.height='auto'; el.style.height=Math.min(el.scrollHeight, 132)+'px';
            };

            const sendText = useCallback(async (rawText) => {
                const text = (rawText || '').trim();
                if (!text || loading || throttle) return;
                vibrate('light');
                setInput('');
                if (textareaRef.current) textareaRef.current.style.height='40px';
                setMessages(p => [...p, {id: Date.now(), role:'user', text, time:formatTime()}]);
                setLoading(true);
                try {
                    const res = await fetch('/api/ai/chat', {
                        method:'POST', headers:{'Content-Type':'application/json'},
                        body:JSON.stringify({init_data:tg.initData, message:text})
                    });
                    const data=await res.json();
                    if (!res.ok) {
                        if (data.quota) setQuota(data.quota);
                        if (res.status===429) {
                            setThrottle(data.wait_seconds);
                            setTimeout(()=>setThrottle(null), data.wait_seconds*1000);
                        }
                        setMessages(p=>[...p,{id:Date.now(),role:'system',text:data.message||'Не получилось выполнить запрос.',type:'error'}]);
                        vibrate('heavy');
                        return;
                    }
                    if (data.quota) setQuota(data.quota);
                    setMessages(p=>[...p,{id:data.message_id,role:'assistant',text:data.answer,time:formatTime(),isCrisis:data.is_crisis,habit:data.suggested_habit,canRate:true,sourcePrompt:text}]);
                    vibrate('light');
                } catch(e) {
                    setMessages(p=>[...p,{id:Date.now(),role:'system',text:online?'Не удалось получить ответ ADAM. Попробуй ещё раз.':'Нет соединения с интернетом.',type:'error'}]);
                    vibrate('heavy');
                } finally { setLoading(false); }
            }, [loading, throttle, online]);

            const sendMsg = () => sendText(input);

            const rate = async (id, rating) => {
                try {
                    await fetch('/api/ai/feedback',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({init_data:tg.initData,message_id:id,rating})});
                    setMessages(p=>p.map(m=>m.id===id?{...m,canRate:false,rated:rating}:m));
                    vibrate('light');
                } catch(e) {}
            };

            const copyMessage = async (text,id) => {
                try { await navigator.clipboard.writeText(text); setCopiedId(id); setTimeout(()=>setCopiedId(null),1400); vibrate('light'); } catch(e) {}
            };

            const regenerate = (message) => {
                if (message?.sourcePrompt) sendText(message.sourcePrompt);
            };

            const addHabit = async (id, habit) => {
                try {
                    const res=await fetch('/api/ai/habit/add',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({init_data:tg.initData,habit_title:habit})});
                    if (!res.ok) throw new Error();
                    setMessages(p=>p.map(m=>m.id===id?{...m,habit:null}:m));
                    tg.showPopup({title:'Привычка добавлена',message:`«${habit}» добавлена в твой план.`,buttons:[{type:'ok'}]});
                    vibrate('medium');
                } catch(e) { tg.showAlert('Не удалось добавить привычку. Попробуй ещё раз.'); }
            };

            const getTip = async () => {
                if (loading) return;
                setLoading(true); vibrate('light');
                try {
                    const res=await fetch('/api/ai/tip',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({init_data:tg.initData})});
                    const data=await res.json();
                    setMessages(p=>[...p,{id:Date.now(),role:'assistant',text:'Совет дня\n\n'+(data.tip||'Сделай сегодня один маленький шаг в сторону своей цели.'),time:formatTime(),canRate:false}]);
                } catch(e) { setMessages(p=>[...p,{id:Date.now(),role:'system',text:'Не удалось получить совет дня.',type:'error'}]); }
                finally { setLoading(false); }
            };

            const quickPrompts=[
                ['calendar_month','Составь план дня'],['analytics','Проанализируй мой день'],['local_fire_department','Мотивируй меня'],['psychology','Помоги разобраться с задачей']
            ];

            const startVoice = () => {
                const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
                if (!SR) { tg.showAlert('Голосовой ввод не поддерживается этим браузером.'); return; }
                if (listening) { recognitionRef.current?.stop(); return; }
                const r=new SR(); recognitionRef.current=r; r.lang='ru-RU'; r.interimResults=true; r.continuous=false;
                r.onstart=()=>{setListening(true);vibrate('medium');};
                r.onresult=e=>{let text='';for(let i=e.resultIndex;i<e.results.length;i++) text+=e.results[i][0].transcript;setInput(text);setTimeout(resizeInput,0);};
                r.onerror=()=>setListening(false); r.onend=()=>setListening(false); r.start();
            };

            return <div className="app-container">
                <div className="header">
                    <div className="header-title">
                        <div className="header-title-icon"><img src="/static/assets/adam-avatar.png" alt="ADAM" /></div>
                        <div className="header-title-copy">
                            <div className="header-title-top"><div className="header-brand">ADAM</div>{quota&&<div className={`quota-panel ${quota.pro?'quota-panel--pro':''}`}><span>✦</span><strong>{quota.pro?'PRO':'STANDARD'}</strong><span><b>{quota.remaining}</b>/{quota.limit}</span></div>}</div>
                            <div className="header-status"><span className="status-dot"></span>{online?'онлайн':'нет соединения'}</div>
                        </div>
                    </div>
                    <div className="header-buttons"><button className="icon-btn" onClick={getTip} title="Совет дня"><span className="premium-icon">lightbulb</span></button><button className="icon-btn" onClick={goHome} title="В меню">⌂</button></div>
                </div>

                <div className="chat-toolbar"><div className="chat-toolbar-title">Твой личный наставник</div><button onClick={()=>{setShowTools(v=>!v);vibrate('light')}}>{showTools?'Скрыть':'Быстрые действия'} <span>⌄</span></button></div>
                {showTools && <div className="quick-prompts">{quickPrompts.map(([icon,label])=><button key={label} onClick={()=>sendText(label)}><span className="premium-icon">{icon}</span>{label}</button>)}</div>}

                <div className="messages-container">
                    {messages.length===0 ? <div className="empty-state">
                        <div className="empty-icon"><img src="/static/assets/adam-avatar.png" alt="ADAM" /></div>
                        <div className="empty-title">Привет, я ADAM</div>
                        <div className="empty-text">Я помогаю планировать день, работать с привычками, разбирать проблемы и видеть твой прогресс.</div>
                        <div className="welcome-prompts">{quickPrompts.slice(0,3).map(([icon,label])=><button key={label} onClick={()=>sendText(label)}><span className="premium-icon">{icon}</span> {label}</button>)}</div>
                    </div> : <>
                        {messages.map(m=><div key={m.id}>
                            {m.type==='error'&&<div className="error-card"><span className="premium-icon">warning</span>{m.text}</div>}
                            {m.role==='user'&&<div className="message user"><div><div className="message-bubble">{m.text}</div><div className="message-time user-time">{m.time}</div></div></div>}
                            {m.role==='assistant'&&<div className="message assistant"><div className="assistant-message-wrap">
                                {m.isCrisis&&<div className="crisis-alert"><span className="premium-icon">warning</span>Важно</div>}
                                <div className="message-bubble"><div style={{whiteSpace:'pre-wrap'}}>{m.text}</div></div>
                                <div className="message-meta"><span>{m.time}</span><div className="message-mini-actions">
                                    <button onClick={()=>copyMessage(m.text,m.id)}>{copiedId===m.id?<><span className="premium-icon">check</span> Скопировано</>:<span className="premium-icon">content_copy</span>}</button>
                                    {!m.isCrisis&&<button onClick={()=>regenerate(m)} disabled={!m.sourcePrompt}><span className="premium-icon">refresh</span></button>}
                                </div></div>
                                {m.canRate&&!m.isCrisis&&<div className="message-actions"><button className="action-btn" onClick={()=>rate(m.id,'up')}><span className="premium-icon">thumb_up</span>Полезно</button><button className="action-btn" onClick={()=>rate(m.id,'down')}><span className="premium-icon">thumb_down</span>Можно лучше</button></div>}
                                {m.rated&&<div className="rated-note">{m.rated==='up'?'Спасибо! Это помогает ADAM становиться лучше.':'Принял. Учту твой отзыв.'}</div>}
                                {m.habit&&<div className="habit-suggestion"><div><span className="habit-label">ПРЕДЛОЖЕНИЕ</span><strong><span className="premium-icon">add_circle</span> {m.habit}</strong></div><button className="add-habit-btn" onClick={()=>addHabit(m.id,m.habit)}>Добавить</button></div>}
                            </div></div>}
                        </div>)}
                        {loading&&<div className="message assistant"><div className="thinking"><div className="thinking-avatar"><img src="/static/assets/adam-avatar.png" alt="" /></div><div><div className="thinking-title">ADAM думает</div><div className="thinking-dots"><i></i><i></i><i></i></div></div></div></div>}
                        <div ref={messagesEnd}/>
                    </>}
                </div>

                {throttle&&<div className="throttle-warning"><span className="premium-icon">hourglass_top</span>Подожди {throttle} сек.</div>}
                <div className="input-area">
                    <div className="input-row">
                        <div className="input-wrapper"><textarea ref={textareaRef} value={input} onChange={e=>{setInput(e.target.value);resizeInput()}} onKeyDown={e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMsg()}}} placeholder="Напиши ADAM..." disabled={loading||throttle} rows="1" /></div>
                        <button className={`voice-btn ${listening?'is-listening':''}`} onClick={startVoice} disabled={loading} title="Голосовой ввод">{listening?<span className="premium-icon">mic_off</span>:<span className="premium-icon">mic</span>}</button>
                        <button className="send-btn" onClick={sendMsg} disabled={!input.trim()||loading||throttle} aria-label="Отправить">{loading?<div className="spinner"></div>:<span className="premium-icon">send</span>}</button>
                    </div>
                    <div className="composer-hint">Enter — отправить · Shift+Enter — новая строка</div>
                </div>
            </div>;
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<AiChat />);
    </script>
</body>
</html>

.chat-toolbar{display:flex;align-items:center;justify-content:space-between;padding:8px 15px;background:rgba(10,7,18,.62);border-bottom:1px solid rgba(255,255,255,.045);backdrop-filter:blur(16px);position:relative;z-index:3}

.quick-prompts button,.welcome-prompts button{border:1px solid rgba(167,139,250,.13);background:rgba(255,255,255,.045);color:#C9C5D5;border-radius:13px;padding:10px 9px;font-size:11px;text-align:left}
