<!DOCTYPE html>
<html lang="ru">

<script>
window.onerror = function(msg, url, line, col, error) {
    document.body.innerHTML = 
        '<pre style="color:#ff6b6b;padding:20px;white-space:pre-wrap;font-size:14px;">' +
        'JS Error: ' + msg + '\nStr: ' + line + ':' + col +
        '</pre>';
};
</script>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Наставник</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <script>
    window.onerror = function(msg, url, line, col, error) {
        document.body.innerHTML =
            '<pre style="color:#ff6b6b;padding:20px;white-space:pre-wrap;font-size:14px;">' +
            'JS Error: ' + msg + '\nStr: ' + line + ':' + col +
            '</pre>';
    };
    </script>
    <script src="/static/vendor/react.production.min.js?v=2"></script>
    <script src="/static/vendor/react-dom.production.min.js?v=2"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="/static/vendor/babel.min.js?v=2"></script>
    <style>
    :root{
        --bg:#07040E;
        --surface: rgba(18,14,28,.72);
        --surface-light: rgba(255,255,255,.06);
        --border: rgba(255,255,255,.08);
        --text:#FFFFFF;
        --text-muted:#9D9DB3;
        --primary:#7C5CFC;
        --primary-dark:#6D28D9;
        --gold:#FFD54F;
        --gold-dark:#F0B429;
       --red:#EF4444;
        --radius:24px;
        --primary-light:#A78BFA;
        --tg-safe-top: 0px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body, #root { width: 100%; height: 100%; }

    body {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        color: var(--text);
        background:
            radial-gradient(circle at 20% 0%, rgba(124,92,252,.22), transparent 38%),
            radial-gradient(circle at 100% 10%, rgba(240,180,41,.12), transparent 32%),
            radial-gradient(circle at 50% 100%, rgba(255,106,77,.10), transparent 40%),
            var(--bg);
        -webkit-tap-highlight-color: transparent;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
    }

    /* HEADER */
    .header {
        position: sticky;
        top: 0;
        z-index: 20;
        padding: 14px 18px 16px;
        padding-top: calc(14px + var(--tg-safe-top));
        box-shadow: 0 12px 32px rgba(0,0,0,.35);
        background: var(--surface);
        backdrop-filter: blur(22px);
        -webkit-backdrop-filter: blur(22px);
        border-bottom: 1px solid var(--border);
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .header-title {
        display: flex;
        align-items: center;
        gap: 14px;
        font-family: 'Space Grotesk', sans-serif;
        font-size: 18px;
        font-weight: 700;
    }

    .header-title-icon {
        width: 44px;
        height: 44px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 22px;
        border-radius: 16px;
        background: linear-gradient(135deg, var(--primary), var(--primary-dark));
        box-shadow: 0 8px 20px rgba(124,92,252,.4), inset 0 1px 0 rgba(255,255,255,.15);
    }

    .header-status {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 12px;
        font-weight: 500;
        color: var(--text-muted);
        margin-top: 2px;
    }

    .status-dot {
        width: 7px;
        height: 7px;
        background: var(--gold);
        border-radius: 50%;
        box-shadow: 0 0 6px rgba(255,213,79,.9);
        animation: pulse 2s infinite;
    }

    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }

    .header-buttons { display: flex; gap: 8px; }

    .icon-btn {
        width: 40px;
        height: 40px;
        border: 1px solid var(--border);
        background: rgba(255,213,79,.08);
        color: var(--gold);
        border-radius: 14px;
        cursor: pointer;
        font-size: 18px;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all .2s ease;
    }

    .icon-btn:hover {
        background: rgba(255,213,79,.18);
        border-color: rgba(255,213,79,.4);
        transform: scale(1.06);
    }

    /* MESSAGES */
    .messages-container {
        flex: 1;
        overflow-y: auto;
        padding: 20px 16px;
        display: flex;
        flex-direction: column;
        gap: 14px;
    }

    .messages-container::-webkit-scrollbar { width: 4px; }
    .messages-container::-webkit-scrollbar-track { background: transparent; }
    .messages-container::-webkit-scrollbar-thumb {
        background: linear-gradient(var(--primary), var(--gold));
        border-radius: 2px;
    }

    .empty-state {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100%;
        gap: 18px;
        text-align: center;
    }

    .empty-icon {
        width: 84px;
        height: 84px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 40px;
        border-radius: 28px;
        background: linear-gradient(135deg, var(--primary), var(--primary-dark));
        box-shadow: 0 16px 40px rgba(124,92,252,.4), inset 0 1px 0 rgba(255,255,255,.15);
    }

    .empty-text {
        color: var(--text-muted);
        font-size: 14px;
        line-height: 1.6;
        max-width: 260px;
    }

    .message { display: flex; animation: slideIn .3s ease-out; word-wrap: break-word; }

    @keyframes slideIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .message.user { justify-content: flex-end; }
    .message.assistant { justify-content: flex-start; }

    .message-bubble {
        max-width: 80%;
        padding: 13px 17px;
        border-radius: var(--radius);
        font-size: 14px;
        line-height: 1.5;
    }

    .message.user .message-bubble {
        background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
        color: #fff;
        border-radius: 20px 6px 20px 20px;
        box-shadow: 0 10px 28px rgba(124,92,252,.35);
    }

    .message.assistant .message-bubble {
        background: var(--surface-light);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        color: #e8e8f0;
        border: 1px solid var(--border);
        border-radius: 6px 20px 20px 20px;
    }

    .message-time { font-size: 11px; color: var(--text-muted); margin-top: 5px; }

    .thinking {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 13px 17px;
        background: var(--surface-light);
        border-radius: 6px 20px 20px 20px;
        border: 1px solid var(--border);
        font-size: 13px;
        color: var(--text-muted);
    }

    .spinner {
        width: 13px;
        height: 13px;
        border: 2px solid rgba(124,92,252,.25);
        border-top-color: var(--primary);
        border-radius: 50%;
        animation: spin .8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* FEEDBACK & ACTIONS */
    .message-actions { display: flex; gap: 8px; margin-top: 10px; }

    .action-btn {
        padding: 7px 12px;
        font-size: 12px;
        font-weight: 500;
        border: 1px solid var(--border);
        background: var(--surface-light);
        color: var(--text-muted);
        border-radius: 10px;
        cursor: pointer;
        transition: all .2s ease;
    }

    .action-btn:hover {
        border-color: var(--primary);
        color: var(--primary-light, #A78BFA);
        background: rgba(124,92,252,.12);
    }

    .habit-suggestion {
        position: relative;
        overflow: hidden;
        background: var(--surface-light);
        backdrop-filter: blur(16px);
        padding: 12px 14px;
        border-radius: 16px;
        border: 1px solid rgba(255,213,79,.25);
        margin-top: 10px;
        font-size: 13px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
    }

    .habit-suggestion::before {
        content: "";
        position: absolute;
        left: 0; top: 0; bottom: 0;
        width: 3px;
        background: linear-gradient(var(--gold), var(--gold-dark));
    }

    .add-habit-btn {
        padding: 6px 12px;
        background: linear-gradient(135deg, #FFD76A, var(--gold-dark));
        color: #201703;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        font-weight: 700;
        font-size: 12px;
        box-shadow: 0 6px 16px rgba(240,180,41,.35);
        transition: transform .15s ease;
    }

    .add-habit-btn:hover { transform: scale(1.05); }

    /* INPUT AREA */
    .input-area {
        padding: 14px 16px;
        background: var(--surface);
        backdrop-filter: blur(22px);
        -webkit-backdrop-filter: blur(22px);
        border-top: 1px solid var(--border);
        display: flex;
        gap: 10px;
        align-items: flex-end;
    }

    .input-wrapper {
        flex: 1;
        display: flex;
        align-items: center;
        background: var(--surface-light);
        border: 1px solid var(--border);
        border-radius: 22px;
        padding: 10px 18px;
        transition: all .2s ease;
    }

    .input-wrapper:focus-within {
        border-color: var(--primary);
        box-shadow: 0 0 0 3px rgba(124,92,252,.15);
    }

    .input-wrapper textarea {
        flex: 1;
        background: transparent;
        border: none;
        color: var(--text);
        font-size: 14px;
        font-family: 'Inter', sans-serif;
        resize: none;
        max-height: 100px;
        outline: none;
    }

    .input-wrapper textarea::placeholder { color: var(--text-muted); }

    .send-btn {
        width: 44px;
        height: 44px;
        border: none;
        background: linear-gradient(135deg, #FFD76A, var(--gold-dark));
        color: #201703;
        border-radius: 16px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 18px;
        font-weight: 700;
        box-shadow: 0 10px 24px rgba(240,180,41,.35), inset 0 1px 0 rgba(255,255,255,.4);
        transition: all .2s ease;
        flex-shrink: 0;
    }

    .send-btn:hover:not(:disabled) { transform: scale(1.06); }
    .send-btn:active:not(:disabled) { transform: scale(.94); }
    .send-btn:disabled { opacity: .4; cursor: not-allowed; box-shadow: none; }

    /* ALERTS */
    .throttle-warning {
        background: rgba(255,213,79,.1);
        border: 1px solid rgba(255,213,79,.3);
        color: var(--gold);
        padding: 11px 16px;
        border-radius: 14px;
        font-size: 13px;
        text-align: center;
        margin-bottom: 8px;
    }

    .crisis-alert {
        background: rgba(239,68,68,.12);
        border: 1px solid rgba(239,68,68,.35);
        color: #FF8080;
        padding: 12px;
        border-radius: 14px;
        margin-bottom: 6px;
        font-weight: 600;
        font-size: 13px;
    }

    @media (max-width: 600px) {
        .message-bubble { max-width: 90%; }
    }
</style>
</head>
<body>
    <div id="root"></div>

   <script type="text/babel">
    const { useState, useEffect, useRef, useCallback } = React;

        const tg = window.Telegram.WebApp;
        tg.ready();
        try { tg.expand(); } catch (e) {}
        try { tg.setHeaderColor('#07040E'); tg.setBackgroundColor('#07040E'); } catch (e) {}

        function applySafeArea() {
            const top = (tg.contentSafeAreaInset && tg.contentSafeAreaInset.top || 0)
                      + (tg.safeAreaInset && tg.safeAreaInset.top || 0);
            document.documentElement.style.setProperty('--tg-safe-top', top + 'px');
        }
        applySafeArea();
        try {
            tg.onEvent('safeAreaChanged', applySafeArea);
            tg.onEvent('contentSafeAreaChanged', applySafeArea);
        } catch (e) {}

        function goHome() {
            try { tg.HapticFeedback.impactOccurred('light'); } catch (e) {}
            window.location.href = '/';
        }

        // Нативная кнопка "назад" Telegram — тоже ведёт в главное меню
        try {
            tg.BackButton.show();
            tg.onEvent('backButtonClicked', goHome);
        } catch (e) {}

        // Ключ в sessionStorage: живёт, пока не закрыта сама мини-апп (вкладка/
        // WebView), и переживает переход "назад в меню -> снова в наставника"
        // внутри одной открытой сессии. Полное закрытие мини-аппы уничтожает
        // sessionStorage сам по себе — отдельно чистить ничего не нужно.
        const CHAT_STORAGE_KEY = 'adam_chat_history';

        function loadStoredMessages() {
            try {
                const raw = sessionStorage.getItem(CHAT_STORAGE_KEY);
                return raw ? JSON.parse(raw) : [];
            } catch (e) {
                return [];
            }
        }

        function saveStoredMessages(messages) {
            try {
                sessionStorage.setItem(CHAT_STORAGE_KEY, JSON.stringify(messages));
            } catch (e) {}
        }

        function AiChat() {
            const [messages, setMessages] = useState(loadStoredMessages);
            const [input, setInput] = useState('');
            const [loading, setLoading] = useState(false);
            const [throttle, setThrottle] = useState(null);
            const messagesEnd = useRef(null);

            const scroll = () => { messagesEnd.current?.scrollIntoView({ behavior: 'smooth' }); };
            useEffect(scroll, [messages]);
            useEffect(() => { saveStoredMessages(messages); }, [messages]);

            const sendMsg = useCallback(async () => {
                if (!input.trim() || loading || throttle) return;

                const text = input.trim();
                setInput('');
                setMessages(p => [...p, {
                    id: Date.now(),
                    role: 'user',
                    text,
                    time: new Date().toLocaleTimeString('ru', { hour: '2-digit', minute: '2-digit' })
                }]);

                setLoading(true);

                try {
                    const res = await fetch('/api/ai/chat', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            init_data: tg.initData,
                            message: text
                        })
                    });

                    const data = await res.json();

                    if (!res.ok) {
                        if (res.status === 429) {
                            setThrottle(data.wait_seconds);
                            setTimeout(() => setThrottle(null), data.wait_seconds * 1000);
                        }
                        setMessages(p => [...p, {
                            id: Date.now(),
                            role: 'system',
                            text: data.message || 'Ошибка',
                            type: 'error'
                        }]);
                        return;
                    }

                    setMessages(p => [...p, {
                        id: data.message_id,
                        role: 'assistant',
                        text: data.answer,
                        time: new Date().toLocaleTimeString('ru', { hour: '2-digit', minute: '2-digit' }),
                        isCrisis: data.is_crisis,
                        habit: data.suggested_habit,
                        canRate: true
                    }]);
                } catch (e) {
                    setMessages(p => [...p, {
                        id: Date.now(),
                        role: 'system',
                        text: 'Ошибка подключения',
                        type: 'error'
                    }]);
                } finally {
                    setLoading(false);
                }
            }, [input, loading, throttle, tg.initData]);

            const rate = async (id, rating) => {
                try {
                    await fetch('/api/ai/feedback', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            init_data: tg.initData,
                            message_id: id,
                            rating
                        })
                    });
                    setMessages(p => p.map(m => m.id === id ? { ...m, canRate: false, rated: rating } : m));
                } catch (e) {}
            };

            const addHabit = async (id, habit) => {
                try {
                    await fetch('/api/ai/habit/add', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            init_data: tg.initData,
                            habit_title: habit
                        })
                    });
                    setMessages(p => p.map(m => m.id === id ? { ...m, habit: null } : m));
                    tg.showPopup({ title: '✅ Успешно', message: `Привычка "${habit}" добавлена`, buttons: [{ type: 'ok' }] });
                } catch (e) {}
            };

            const getTip = async () => {
                setLoading(true);
                try {
                    const res = await fetch('/api/ai/tip', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ init_data: tg.initData })
                    });
                    const data = await res.json();
                    setMessages(p => [...p, {
                        id: Date.now(),
                        role: 'assistant',
                        text: '💡 <b>Совет дня</b>\n\n' + data.tip,
                        time: new Date().toLocaleTimeString('ru', { hour: '2-digit', minute: '2-digit' }),
                        isHtml: true
                    }]);
                } finally {
                    setLoading(false);
                }
            };

            return (
                <div className="app-container">
                    <div className="header">
                        <div className="header-title">
                            <div className="header-title-icon">
    <img src="/static/assets/logo.svg" alt="" style={{width: '24px', height: '24px', display: 'block'}} />
</div>
                            <div>
                                <div>AI Наставник</div>
                                <div className="header-status">
                                    <div className="status-dot"></div>
                                    онлайн
                                </div>
                            </div>
                        </div>
                        <div className="header-buttons">
                            <button className="icon-btn" onClick={goHome} title="В главное меню">🏠</button>
                            <button className="icon-btn" onClick={getTip} title="Совет дня">💡</button>
                        </div>
                    </div>

                    <div className="messages-container">
                        {messages.length === 0 ? (
                            <div className="empty-state">
                                <div className="empty-icon">
    <img src="/static/assets/logo.svg" alt="" style={{width: '46px', height: '46px', display: 'block'}} />
</div>
                                <div className="empty-text">
                                    👋 Привет! Я твой персональный<br/>наставник по привычкам.<br/><br/>
                                    Спроси меня что угодно!
                                </div>
                            </div>
                        ) : (
                            <>
                                {messages.map(m => (
                                    <div key={m.id}>
                                        {m.type === 'error' && <div className="throttle-warning">{m.text}</div>}

                                        {m.role === 'user' && (
                                            <div className="message user">
                                                <div>
                                                    <div className="message-bubble">{m.text}</div>
                                                    <div className="message-time" style={{textAlign: 'right'}}>{m.time}</div>
                                                </div>
                                            </div>
                                        )}

                                        {m.role === 'assistant' && (
                                            <div className="message assistant">
                                                <div style={{maxWidth: '80%'}}>
                                                    {m.isCrisis && <div className="crisis-alert">⚠️ Важно</div>}
                                                   <div className="message-bubble">
                                                        {m.isHtml ? React.createElement('div', {dangerouslySetInnerHTML: {__html: m.text}}) : 
                                                        <div style={{whiteSpace: 'pre-wrap'}}>{m.text}</div>}
                                                    </div>
                                                    <div className="message-time">{m.time}</div>

                                                    {m.canRate && !m.isCrisis && (
                                                        <div className="message-actions">
                                                            <button className="action-btn" onClick={() => rate(m.id, 'up')}>👍 Полезно</button>
                                                            <button className="action-btn" onClick={() => rate(m.id, 'down')}>👎 Не понравилось</button>
                                                        </div>
                                                    )}

                                                    {m.habit && (
                                                        <div className="habit-suggestion">
                                                            <span>➕ {m.habit}</span>
                                                            <button className="add-habit-btn" onClick={() => addHabit(m.id, m.habit)}>Добавить</button>
                                                        </div>
                                                    )}
                                                </div>
                                            </div>
                                        )}
                                    </div>
                                ))}
                                {loading && (
                                    <div className="message assistant">
                                        <div className="thinking">
                                            <div className="spinner"></div>
                                            <span>Думаю...</span>
                                        </div>
                                    </div>
                                )}
                                <div ref={messagesEnd} />
                            </>
                        )}
                    </div>

                    {throttle && <div className="throttle-warning">⏳ Подожди {throttle} сек...</div>}

                    <div className="input-area">
                        <div className="input-wrapper">
                            <textarea
                                value={input}
                                onChange={e => setInput(e.target.value)}
                                onKeyPress={e => e.key === 'Enter' && !e.shiftKey && (e.preventDefault(), sendMsg())}
                                placeholder="Напиши вопрос..."
                                disabled={loading || throttle}
                                rows="1"
                                style={{minHeight: '40px'}}
                            />
                        </div>
                        <button className="send-btn" onClick={sendMsg} disabled={!input.trim() || loading || throttle}>
                            {loading ? <div className="spinner"></div> : '➤'}
                        </button>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<AiChat />);
    </script>
</body>
</html>
