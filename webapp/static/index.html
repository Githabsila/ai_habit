<!DOCTYPE html>
<html lang="ru">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,600,1,0">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:FILL@1">

<title>Project ADAM</title>

<link rel="stylesheet" href="/static/style.css?v=1003">
</head>
<body>

<div id="app">

<header class="player-card">

<div class="player-card__ring-wrap">

<svg class="level-ring" viewBox="0 0 120 120">

<defs>
<linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" stop-color="#FFD76A"></stop>
<stop offset="100%" stop-color="#F0B429"></stop>
</linearGradient>
</defs>

<circle class="level-ring__track"
cx="60"
cy="60"
r="52"></circle>

<circle class="level-ring__fill"
id="levelRingFill"
cx="60"
cy="60"
r="52"></circle>

</svg>

<div class="level-ring__badge">

<span id="levelNumber">1</span>
<small>LVL</small>

</div>

</div>

<div class="player-card__info">

<div class="player-card__name" id="playerName">

👋 Добро пожаловать

</div>

<div class="player-card__stats">

<div class="stat stat--coin">
    <span class="material-symbols-rounded stat-icon">diamond</span>
    <span id="coinValue">0</span>
</div>

<div class="stat stat--streak">
    <span class="material-symbols-rounded stat-icon">local_fire_department</span>
    <span id="streakValue">0</span>
</div>

</div>

<div class="xp-bar">

<div class="xp-bar__fill" id="xpBarFill"
style="width:0%">
</div>

</div>

<div class="xp-bar__label" id="xpLabel">

0 / 100 XP

</div>

</div>

</header>

<main id="content">

<!-- ===================== HOME ===================== -->
<section class="tab-panel" data-tab="home">

<div class="section-heading">

<h2>Сегодня</h2>

<span class="section-heading__sub" id="habitsProgressLabel">

0/0 сегодня

</span>

</div>

<ul class="habit-list" id="habitList">
</ul>

<form class="add-form" id="addHabitForm">

<input
type="text"
id="newHabitInput"
placeholder="Новая привычка..."
>

<button
type="submit"
class="btn btn--accent">

+

</button>

</form>

</section>

<!-- ===================== CALENDAR ===================== -->
<section class="tab-panel" data-tab="calendar" hidden>

<div class="section-heading">

<h2>Календарь</h2>

</div>

<div class="calendar-grid" id="calendarGrid">
</div>

</section>

<!-- ===================== RATING ===================== -->
<section class="tab-panel" data-tab="rating" hidden>

<div class="section-heading">

<h2>Рейтинг</h2>

</div>

<ul class="rating-list" id="ratingList">
</ul>

</section>

<!-- ===================== PROFILE ===================== -->
<section class="tab-panel" data-tab="profile" hidden>

<div class="section-heading">

<h2>Достижения</h2>

<span class="section-heading__sub" id="achievementsCountLabel">

0 наград

</span>

</div>

<ul class="achievement-list" id="achievementList">
</ul>

<div class="section-heading">

<h2>Магазин</h2>

</div>

<ul class="shop-list" id="shopList">
</ul>

</section>

</main>

<nav class="tab-bar" id="tabBar">

    <nav class="tab-bar" id="tabBar">

    <button class="tab-bar__item is-active" data-tab="home">
        <span class="material-symbols-rounded tab-bar__icon">home</span>
        <span>Главная</span>
    </button>

    <button class="tab-bar__item" data-tab="calendar">
        <span class="material-symbols-rounded tab-bar__icon">calendar_month</span>
        <span>Календарь</span>
    </button>

    <button class="tab-bar__item" id="aiCoachBtn">
    <span class="material-symbols-rounded tab-bar__icon">smart_toy</span>
    <span>ИИ</span>
</button>

    <button class="tab-bar__item" data-tab="rating">
        <span class="material-symbols-rounded tab-bar__icon">emoji_events</span>
        <span>Рейтинг</span>
    </button>

    <button class="tab-bar__item" data-tab="profile">
        <span class="material-symbols-rounded tab-bar__icon">person</span>
        <span>Профиль</span>
    </button>

</nav>

</div>

<div class="toast" id="toast"></div>

<div class="loading-overlay" id="loadingOverlay">
  <div class="loading-overlay__coin">🪙</div>
</div>




<div class="levelup-overlay" id="levelupOverlay" hidden>
  <div class="levelup-card">
    <div class="levelup-sparkles">✨🎉✨</div>
    <div class="levelup-title">LEVEL UP</div>
    <div class="levelup-level">Новый уровень: <span id="levelupValue">0</span></div>
  </div>
</div>

<div class="bg-particles">
  <span></span>
  <span></span>
  <span></span>
  <span></span>
  <span></span>
</div>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script type="module" src="/static/app.js?v=1003"></script>

</body>
</html>
