<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Project ADAM</title>

<link rel="stylesheet" href="/static/style.css?v=1001">
</head>
<body>

<div id="app">

<header class="player-card">

<div class="player-card__ring-wrap">

<svg class="level-ring" viewBox="0 0 120 120">

<circle class="level-ring__track"
cx="60"
cy="60"
r="52"></circle>

<circle class="level-ring__fill"
cx="60"
cy="60"
r="52"
style="stroke-dashoffset:108"></circle>

</svg>

<div class="level-ring__badge">

<span>8</span>
<small>LVL</small>

</div>

</div>

<div class="player-card__info">

<div class="player-card__name">

👋 Добро пожаловать

</div>

<div class="player-card__stats">

<div class="stat stat--coin">

🪙 1320

</div>

<div class="stat stat--streak">

🔥 18

</div>

</div>

<div class="xp-bar">

<div class="xp-bar__fill"
style="width:67%">
</div>

</div>

<div class="xp-bar__label">

1240 / 1800 XP

</div>

</div>

</header>

<main id="content">

<div class="section-heading">

<h2>Сегодня</h2>

<span class="section-heading__sub">

3 привычки

</span>

</div>

<ul class="habit-list">

<li class="habit-item">

<div class="habit-item__check"></div>

<div class="habit-item__title">

Тренировка

</div>

</li>

<li class="habit-item is-done">

<div class="habit-item__check">

✓

</div>

<div class="habit-item__title">

Английский

</div>

</li>

<li class="habit-item">

<div class="habit-item__check"></div>

<div class="habit-item__title">

Читать 20 минут

</div>

</li>

</ul>

<form class="add-form">

<input
type="text"
placeholder="Новая привычка..."
>

<button
type="button"
class="btn btn--accent">

+

</button>

</form>

</main>

<nav class="tab-bar">

<button class="tab-bar__item is-active">

<div class="tab-bar__icon">

🏠

</div>

<span>

Главная

</span>

</button>

<button class="tab-bar__item">

<div class="tab-bar__icon">

📅

</div>

<span>

Календарь

</span>

</button>

<button class="tab-bar__item">

<div class="tab-bar__icon">

🏆

</div>

<span>

Рейтинг

</span>

</button>

<button class="tab-bar__item">

<div class="tab-bar__icon">

👤

</div>

<span>

Профиль

</span>

</button>

</nav>

<div class="toast"></div>

<div class="loading-overlay" hidden>

<div class="loading-overlay__coin">

🪙

</div>

</div>

</div>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<script type="module" src="/static/app.js?v=1001"></script>

</body>

<div class="bg-particles">
  <span></span>
  <span></span>
  <span></span>
  <span></span>
  <span></span>
</div>


</html>
