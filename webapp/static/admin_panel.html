<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Admin Panel</title>
<link rel="icon" type="image/svg+xml" href="/static/assets/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js" crossorigin="anonymous"></script>
<style>
:root{
  --bg:#07060b;
  --glass:rgba(20,17,29,.72);
  --glass-strong:rgba(28,24,40,.94);
  --border:rgba(255,255,255,.09);
  --text:#F2EFFB;
  --muted:#938DA6;
  --violet:#8f72ff;
  --violet-deep:#6542dc;
  --gold:#F0B429;
  --red:#EF4444;
  --green:#34D399;
  --radius:20px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;min-height:100%}
body{
  font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
  color:var(--text);
  background:
    radial-gradient(700px 430px at 50% -8%,rgba(126,92,246,.22),transparent 62%),
    radial-gradient(500px 400px at 100% 45%,rgba(240,180,41,.06),transparent 65%),
    var(--bg);
  min-height:100vh;
  padding-bottom:40px;
}
.wrap{max-width:640px;margin:0 auto;padding:calc(16px + var(--tg-safe-top,0px)) 14px calc(24px + env(safe-area-inset-bottom,0px));}

/* ===== header ===== */
.header{
  display:flex;align-items:center;gap:12px;
  padding:14px 4px 18px;
}
.header-icon{
  width:46px;height:46px;border-radius:16px;flex:0 0 auto;
  display:grid;place-items:center;font-size:21px;
  background:linear-gradient(145deg,#9578ff,#6847dc);
  box-shadow:0 10px 26px rgba(104,71,220,.35),inset 0 1px 0 rgba(255,255,255,.22);
}
.header-copy{min-width:0}
.header-title{font:800 18px/1.15 'Space Grotesk',sans-serif;letter-spacing:-.01em}
.header-sub{margin-top:2px;font-size:11px;color:var(--muted)}
.header-back{
  margin-left:auto;flex:0 0 auto;width:38px;height:38px;border-radius:12px;
  display:grid;place-items:center;border:1px solid var(--border);background:rgba(255,255,255,.04);
  color:var(--text);font-size:16px;cursor:pointer;transition:transform .15s ease,background .15s ease;
}
.header-back:active{transform:scale(.92)}

/* ===== cards ===== */
.card{
  position:relative;
  border:1px solid var(--border);
  border-radius:var(--radius);
  background:linear-gradient(150deg,rgba(35,30,48,.9),rgba(15,13,22,.94));
  box-shadow:0 16px 40px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.06);
  padding:16px;
  margin-bottom:14px;
  animation:cardIn .42s cubic-bezier(.2,.8,.2,1) both;
}
.card + .card{animation-delay:.04s}
@keyframes cardIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.card-title{
  display:flex;align-items:center;gap:10px;
  font:800 13.5px/1 'Space Grotesk',sans-serif;letter-spacing:.01em;
  margin-bottom:14px;color:#EAE5FA;
}
.card-icon{
  width:30px;height:30px;border-radius:10px;flex:0 0 auto;
  display:grid;place-items:center;font-size:14px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 6px 14px rgba(0,0,0,.25);
}
.card-icon--violet{background:linear-gradient(145deg,#9578ff,#6847dc)}
.card-icon--gold{background:linear-gradient(145deg,#FFD76A,#EFB331)}
.card-icon--teal{background:linear-gradient(145deg,#3EE0A8,#0F9D6C)}
.card-icon--red{background:linear-gradient(145deg,#FF8A6B,#E23B3B)}

/* ===== section grouping — визуальные "разделения" верхнего уровня ===== */
.section-label{
  font:800 10px/1 'Space Grotesk',sans-serif;
  letter-spacing:.16em;text-transform:uppercase;
  color:#6E6980;
  margin:22px 6px 10px;
}
.section-label:first-child{margin-top:2px}

/* ===== stats (report_html — сгруппированные строки, не сплошной текст) ===== */
.stats-group-label{
  font:800 9.5px/1 'Space Grotesk',sans-serif;
  letter-spacing:.14em;text-transform:uppercase;
  color:#a996ff;
  margin:14px 2px 8px;
}
.stats-group-label:first-child{margin-top:0}
.stat-row{
  display:flex;align-items:flex-start;gap:10px;
  padding:9px 10px;border-radius:13px;
  background:rgba(255,255,255,.03);
  border:1px solid rgba(255,255,255,.05);
  margin-bottom:6px;
}
.stat-row-icon{
  width:26px;height:26px;border-radius:9px;flex:0 0 auto;
  display:grid;place-items:center;font-size:13px;
  background:rgba(255,255,255,.05);
}
.stat-row-body{display:flex;flex-wrap:wrap;gap:5px 16px;flex:1;min-width:0;padding-top:2px}
.stat-chip{font-size:12px;line-height:1.5;color:#C9C4DA;min-width:0;overflow-wrap:anywhere}
.stat-chip b{color:#fff;font-weight:800}
.stats-body b{color:#fff}

/* ===== buttons ===== */
.btn{
  border:1px solid var(--border);
  border-radius:13px;
  padding:10px 14px;
  font:700 12.5px/1 'Inter',sans-serif;
  color:var(--text);
  background:linear-gradient(145deg,rgba(255,255,255,.07),rgba(255,255,255,.02));
  cursor:pointer;
  transition:transform .15s cubic-bezier(.34,1.56,.64,1),filter .15s ease;
  display:inline-flex;align-items:center;gap:6px;
}
.btn:active{transform:scale(.95);filter:brightness(.95)}
.btn:disabled{opacity:.45;pointer-events:none}
.btn-accent{
  background:linear-gradient(135deg,#8e70ff,#6847dc);
  border-color:rgba(255,255,255,.14);
  box-shadow:0 10px 24px rgba(104,71,220,.28),inset 0 1px 0 rgba(255,255,255,.2);
}
.btn-gold{
  background:linear-gradient(135deg,#FFD76A,#EFB331);
  border-color:rgba(255,255,255,.2);
  color:#221A02;
  box-shadow:0 10px 24px rgba(240,180,41,.25),inset 0 1px 0 rgba(255,255,255,.4);
}
.btn-danger{
  background:linear-gradient(135deg,rgba(239,68,68,.85),rgba(185,40,40,.9));
  border-color:rgba(255,255,255,.12);
}
.btn-row{display:flex;flex-wrap:wrap;gap:8px}
.btn-block{width:100%;justify-content:center}

/* ===== inputs ===== */
.field{
  width:100%;border:1px solid var(--border);border-radius:13px;
  background:rgba(255,255,255,.04);color:var(--text);
  padding:11px 13px;font:500 13px/1.4 'Inter',sans-serif;
  outline:none;transition:border-color .15s ease,box-shadow .15s ease;
}
.field:focus{border-color:rgba(143,114,255,.5);box-shadow:0 0 0 3px rgba(143,114,255,.12)}
.field::placeholder{color:#6E6980}
textarea.field{resize:vertical;min-height:88px}

/* ===== pending list ===== */
.list-row{
  display:flex;align-items:center;gap:10px;
  padding:10px 4px;border-bottom:1px solid rgba(255,255,255,.05);
}
.list-row:last-child{border-bottom:none}
.list-row-name{flex:1;min-width:0;font-size:12.5px}
.list-row-name b{display:block;font-size:13px}
.list-row-name small{color:var(--muted)}
.empty-note{color:var(--muted);font-size:12px;padding:6px 2px}

/* ===== user card result ===== */
.user-card{
  border:1px solid var(--border);border-radius:16px;
  background:rgba(255,255,255,.03);padding:14px;margin-top:12px;
  animation:cardIn .32s cubic-bezier(.2,.8,.2,1) both;
}
.user-card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.user-card-name{font:800 15px/1.2 'Space Grotesk',sans-serif;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.user-card-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.user-tile{
  border:1px solid rgba(255,255,255,.05);border-radius:12px;
  background:rgba(255,255,255,.035);
  padding:9px 11px;
}
.user-tile-label{font-size:9.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}
.user-tile-value{font-size:13.5px;font-weight:800;margin-top:3px;color:#fff}
.badge{display:inline-block;padding:3px 10px;border-radius:99px;font-size:10.5px;font-weight:700;flex:0 0 auto}
.badge-ok{background:rgba(52,211,153,.15);color:var(--green)}
.badge-bad{background:rgba(239,68,68,.15);color:#FF8080}

/* ===== toast ===== */
.toast{
  position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(8px);
  background:rgba(20,17,29,.96);border:1px solid var(--border);border-radius:13px;
  padding:11px 18px;font-size:12.5px;box-shadow:0 20px 50px rgba(0,0,0,.4);
  opacity:0;pointer-events:none;transition:opacity .22s ease,transform .22s ease;
  z-index:50;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ===== gate / loading ===== */
.gate{
  min-height:70vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:14px;text-align:center;padding:20px;
}
.gate-icon{font-size:40px}
.spinner{
  width:26px;height:26px;border-radius:50%;
  border:3px solid rgba(143,114,255,.2);border-top-color:#a78bfa;
  animation:spin .8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

/* ===== performance-lite: слабые устройства — без анимаций ===== */
.performance-lite .card{animation:none !important}
.performance-lite .btn{transition:none !important}
.performance-lite .toast{transition:opacity .05s linear !important}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none !important;transition:none !important}
}
</style>
</head>
<body>
<div class="wrap" id="root">
  <div class="gate">
    <div class="spinner"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  // См. такой же guard в app.js — призрачный клик, доставленный WebView
  // уже после навигации на новую страницу, в тех же координатах, может
  // случайно попасть на "✕" здесь же и т.п. Глушим первый клик в первые
  // полсекунды после загрузки.
  var PAGE_LOAD_AT = Date.now();
  document.addEventListener('click', function(e){
    if (Date.now() - PAGE_LOAD_AT < 500) {
      e.stopPropagation();
      e.preventDefault();
    }
  }, { capture: true });

  try{
    var lowPower = (navigator.hardwareConcurrency && navigator.hardwareConcurrency <= 4)
      || (navigator.deviceMemory && navigator.deviceMemory <= 4)
      || (navigator.connection && navigator.connection.saveData);
    if (lowPower) document.documentElement.classList.add('performance-lite');
  }catch(e){}

  var tg = window.Telegram && window.Telegram.WebApp;
  try{ tg.ready(); tg.expand(); }catch(e){}
  try{ tg.setHeaderColor('#07060b'); tg.setBackgroundColor('#07060b'); }catch(e){}

  // Официальный WebView Telegram рисует свои "Закрыть / ˅ / ⋮" поверх
  // страницы сверху — без этого шапка панели пряталась под них
  // (см. contentSafeAreaInset — то же самое уже используется в ai_coach.js).
  function applySafeArea(){
    try{
      var top = ((tg.contentSafeAreaInset && tg.contentSafeAreaInset.top) || 0)
        + ((tg.safeAreaInset && tg.safeAreaInset.top) || 0);
      document.documentElement.style.setProperty('--tg-safe-top', top + 'px');
    }catch(e){}
  }
  applySafeArea();
  try{
    tg.onEvent('safeAreaChanged', applySafeArea);
    tg.onEvent('contentSafeAreaChanged', applySafeArea);
  }catch(e){}

  var root = document.getElementById('root');
  var toastEl = document.getElementById('toast');
  var toastTimer = null;

  function showToast(text){
    toastEl.textContent = text;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toastEl.classList.remove('show'); }, 2200);
  }

  function escapeHtml(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  function haptic(kind){
    try{ tg.HapticFeedback.impactOccurred(kind || 'light'); }catch(e){}
  }

  function initData(){ return (tg && tg.initData) || ''; }

  async function api(path, opts){
    opts = opts || {};
    var headers = Object.assign({ 'Authorization': 'tma ' + initData() }, opts.headers || {});
    if (opts.body && !headers['Content-Type']) headers['Content-Type'] = 'application/json';
    var res = await fetch(path, Object.assign({}, opts, { headers: headers }));
    var data = null;
    try{ data = await res.json(); }catch(e){}
    if (!res.ok){
      var err = new Error((data && data.error) || ('http_' + res.status));
      err.status = res.status; err.data = data;
      throw err;
    }
    return data;
  }

  function renderGate(message, isError){
    root.innerHTML =
      '<div class="gate">' +
        '<div class="gate-icon">' + (isError ? '⛔' : '🔐') + '</div>' +
        '<div style="font:700 14px Inter,sans-serif;color:#D8D4E6">' + escapeHtml(message) + '</div>' +
      '</div>';
  }

  // Строки report_html (см. admin_digest_scheduler.py::build_stats_report)
  // разделены пустой строкой, каждая начинается с эмодзи. Раньше это лилось
  // одним сплошным абзацем — теперь режем на подписанные группы строк.
  var STATS_GROUPS = {
    '👥':'Аудитория','📈':'Аудитория','💎':'Аудитория','⭐':'Аудитория',
    '🔐':'Воронка входа','📝':'Воронка входа','💬':'Воронка входа','🧪':'Воронка входа',
    '💳':'Монетизация',
    '✅':'Привычки',
    '🔥':'ИИ и расходы','🤖':'ИИ и расходы',
    '📬':'Здоровье','🩺':'Здоровье'
  };

  function renderStats(html){
    var text = String(html || '').replace(/^\s*📊\s*<b>Статистика бота<\/b>\s*/, '').trim();
    var blocks = text.split(/\n\s*\n/).map(function(b){ return b.trim(); }).filter(Boolean);
    var out = '';
    var lastGroup = null;
    blocks.forEach(function(block){
      var m = block.match(/^(\S+)\s+([\s\S]*)$/);
      var icon = m ? m[1] : '•';
      var rest = m ? m[2] : block;
      var group = STATS_GROUPS[icon];
      if (group && group !== lastGroup){
        out += '<div class="stats-group-label">' + escapeHtml(group) + '</div>';
        lastGroup = group;
      }
      var chips = rest.split(' · ').map(function(p){ return '<span class="stat-chip">' + p + '</span>'; }).join('');
      out += '<div class="stat-row"><div class="stat-row-icon">' + icon + '</div><div class="stat-row-body">' + chips + '</div></div>';
    });
    return out || '<div class="empty-note">Нет данных</div>';
  }

  function renderPanel(state){
    root.innerHTML =
      '<div class="header">' +
        '<div class="header-icon">🛠</div>' +
        '<div class="header-copy">' +
          '<div class="header-title">Admin Panel</div>' +
          '<div class="header-sub">Project ADAM · ' + state.total_users + ' пользователей</div>' +
        '</div>' +
        '<button class="header-back" id="backBtn">✕</button>' +
      '</div>' +

      '<div class="section-label">Мониторинг</div>' +

      '<div class="card">' +
        '<div class="card-title"><span class="card-icon card-icon--violet">📊</span>Статистика</div>' +
        '<div class="stats-body">' + renderStats(state.report_html) + '</div>' +
        '<div class="btn-row" style="margin-top:12px">' +
          '<button class="btn" id="refreshStatsBtn">↻ Обновить</button>' +
        '</div>' +
      '</div>' +

      '<div class="card">' +
        '<div class="card-title"><span class="card-icon card-icon--teal">📈</span>Аналитика</div>' +
        '<div class="empty-note" style="padding:0 0 12px">Отдельный раздел: воронка и где застревают, удержание по неделям, использование каждой функции (новые функции появляются сами), версии приложения, здоровье сервера, каналы трафика и ссылки, ИИ-аналитик с памятью. Быстро открыть: команда /analytics в боте.</div>' +
        '<div class="btn-row"><button class="btn btn-accent" id="openAnalyticsBtn" style="flex:1;justify-content:center">📊 Открыть аналитику</button></div>' +
      '</div>' +

      '<div class="card">' +
        '<div class="card-title"><span class="card-icon card-icon--gold">⏳</span>Заявки на доступ</div>' +
        '<div id="pendingList"><div class="empty-note">Загружаю…</div></div>' +
      '</div>' +

      '<div class="card">' +
        '<div class="card-title"><span class="card-icon card-icon--red">📉</span>Риск оттока</div>' +
        '<div id="churnRiskBox"><div class="empty-note">Загружаю…</div></div>' +
      '</div>' +

      '<div class="card">' +
        '<div class="card-title"><span class="card-icon card-icon--red">🐞</span>JS-ошибки на устройствах</div>' +
        '<div id="clientErrorsBox"><div class="empty-note">Загружаю…</div></div>' +
      '</div>' +

      '<div class="card">' +
        '<div class="card-title"><span class="card-icon card-icon--violet">🚩</span>Feature flags</div>' +
        '<div id="flagsBox"><div class="empty-note">Загружаю…</div></div>' +
        '<div class="btn-row" style="margin-top:10px">' +
          '<input class="field" id="newFlagKey" type="text" placeholder="ключ_флага" style="flex:1">' +
          '<button class="btn btn-accent" id="addFlagBtn">+ Добавить</button>' +
        '</div>' +
      '</div>' +

      '<div class="section-label">Управление</div>' +

      '<div class="card">' +
        '<div class="card-title"><span class="card-icon card-icon--teal">🔎</span>Найти пользователя</div>' +
        '<input class="field" id="userIdInput" type="text" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="@ник, имя или Telegram ID">' +
        '<div class="btn-row" style="margin-top:10px">' +
          '<button class="btn btn-accent" id="lookupBtn">🔎 Найти</button>' +
        '</div>' +
        '<div id="userMatchesBox"></div>' +
        '<div id="userCardBox"></div>' +
      '</div>' +

      '<div class="card">' +
        '<div class="card-title"><span class="card-icon card-icon--teal">🔑</span>Доступы</div>' +
        '<div class="empty-note" style="padding:0 0 10px">Кому выдан временный доступ или включён сценарий триала, и сколько осталось. Новый человек по умолчанию входит свободно — как сейчас. Чтобы выдать доступ, найди человека по @нику выше.</div>' +
        '<div id="accessOverviewBox"><div class="empty-note">Загружаю…</div></div>' +
      '</div>' +

      '<div class="card">' +
        '<div class="card-title"><span class="card-icon card-icon--violet">🔥</span>Расход ИИ</div>' +
        '<div class="empty-note" style="padding:0 0 10px">Токены модели по людям и по функциям: кто больше всех тратит и на что. Отсюда можно открыть человека и временно ограничить ему ИИ.</div>' +
        '<div class="btn-row" style="margin-bottom:10px">' +
          '<button class="btn btn-accent" data-ai-days="1">Сегодня</button><button class="btn" data-ai-days="7">7 дней</button><button class="btn" data-ai-days="30">30 дней</button>' +
        '</div>' +
        '<div id="aiUsageBox"><div class="empty-note">Загружаю…</div></div>' +
      '</div>' +

      '<div class="card">' +
        '<div class="card-title"><span class="card-icon card-icon--gold">🏅</span>Кому выдать медаль</div>' +
        '<div class="empty-note" style="padding:0 0 10px">Активные за неделю, у кого самая длинная серия. Медаль выдаёт только админ — в магазине её нет.</div>' +
        '<div id="activeUsersBox"><div class="empty-note">Загружаю…</div></div>' +
      '</div>' +

      '<div class="card">' +
        '<div class="card-title"><span class="card-icon card-icon--red">📢</span>Рассылка</div>' +
        '<textarea class="field" id="broadcastText" placeholder="Текст сообщения… (можно HTML-теги Telegram: &lt;b&gt;, &lt;i&gt;)"></textarea>' +
        '<select class="field" id="broadcastSegment" style="margin-top:8px"><option value="">Все пользователи</option></select>' +
        '<input class="field" id="broadcastTag" type="text" placeholder="...или тег (игнорируется, если выбран сегмент выше)" style="margin-top:8px">' +
        '<div class="btn-row" style="margin-top:10px">' +
          '<button class="btn btn-gold btn-block" id="broadcastBtn">📢 Отправить</button>' +
        '</div>' +
      '</div>' +

      '<div class="card">' +
        '<div class="card-title"><span class="card-icon card-icon--teal">💾</span>Экспорт БД</div>' +
        '<div class="empty-note" style="padding:0 0 10px">Полный дамп базы одной кнопкой — снимок делается безопасно (sqlite Backup API), не сырой файл.</div>' +
        '<div class="btn-row">' +
          '<button class="btn btn-block" id="exportDbBtn">💾 Скачать дамп .db</button>' +

  async function exportDb(){
    var btn = document.getElementById('exportDbBtn');
    btn.disabled = true;
    var original = btn.textContent;
    btn.textContent = '💾 Готовлю…';
    try{
      // Не через api() — тот всегда парсит JSON, а тут нужен бинарный файл.
      var res = await fetch('/api/admin/export-db', { headers: { 'Authorization': 'tma ' + initData() } });
      if (!res.ok) throw new Error('export_failed');
      var blob = await res.blob();
      var disposition = res.headers.get('Content-Disposition') || '';
      var match = disposition.match(/filename="([^"]+)"/);
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = match ? match[1] : 'adam_db_export.db';
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
      haptic('light');
      showToast('Дамп готов');
    }catch(e){
      showToast('Не получилось скачать дамп');
    }finally{
      btn.disabled = false;
      btn.textContent = original;
    }
  }

  async function lookupUser(){
    var input = document.getElementById('userIdInput');
    var box = document.getElementById('userCardBox');
    var matches = document.getElementById('userMatchesBox');
    var q = (input.value || '').trim();
    if (!q){ showToast('Введи @ник, имя или ID'); return; }
    matches.innerHTML = '';
    box.innerHTML = '<div class="empty-note">Ищу…</div>';
    try{
      if (/^\d+$/.test(q)){
        renderUserCard(await api('/api/admin/user/' + q));
        return;
      }
      var found = (await api('/api/admin/users/search?q=' + encodeURIComponent(q))).users || [];
      if (!found.length){
        box.innerHTML = '<div class="empty-note">Никого не нашёл. Человек должен хотя бы раз запустить бота.</div>';
      } else if (found.length === 1){
        renderUserCard(await api('/api/admin/user/' + found[0].telegram_id));
      } else {
        box.innerHTML = '';
        matches.innerHTML = '<div class="empty-note" style="padding:10px 0 4px">Нашлось несколько — выбери:</div>' +
          found.map(function(u){ return userRowHtml(u, false); }).join('');
        bindUserRows(matches);
      }
    }catch(e){
      box.innerHTML = '<div class="empty-note">Пользователь не найден</div>';
    }
  }

  function hm(minute){
    if (minute === null || minute === undefined) return 'пока неизвестно (мало данных)';
    return 'обычно около ' + ('0' + Math.floor(minute / 60)).slice(-2) + ':' + ('0' + (minute % 60)).slice(-2);
  }

  async function showAdamPreview(key, source){
    var out = document.getElementById('adamPreview');
    if (!out) return;
    out.innerHTML = '<div class="empty-note">Адам пишет…</div>';
    try{
      var r = await api('/api/admin/lab/adam/preview', { method: 'POST', body: JSON.stringify({ scenario: key, source: source }) });
      var stt = r.state || {};
      var facts = '🕒 ' + escapeHtml(stt.time || '') + ' · выполнено ' + stt.done + '/' + stt.total + ' (привычки ' + escapeHtml(stt.habits || '') + ', задачи ' + escapeHtml(stt.tasks || '') + ') · серия ' + stt.streak +
        (stt.pending && stt.pending.length ? '<br>осталось: ' + stt.pending.map(function(p){ return '«' + escapeHtml(p) + '»'; }).join(', ') : '') +
        (stt.mood_hint ? '<br>пометка: ' + escapeHtml(stt.mood_hint) : '');
      var decisions = '';
      if (r.decisions){
        var label = function(x){ return x.scenario ? escapeHtml(x.scenario) : ('ничего — ' + escapeHtml(x.reason)); };
        decisions = '<div class="empty-note" style="padding:6px 0">Что сделают пуши сегодня: день → ' + label(r.decisions.day) + '; вечер → ' + label(r.decisions.evening) + ' (' + (r.decisions.chat_day ? 'чатовый день' : 'не чатовый день') + ')</div>';
      }
      var bubble = r.text
        ? '<div style="background:rgba(124,92,252,.14);border:1px solid rgba(124,92,252,.35);border-radius:14px;padding:12px 14px;font-size:14px;line-height:1.45;margin:6px 0">' + escapeHtml(r.text) + '</div>'
        : '<div class="empty-note">Сейчас Адам бы ничего не написал: ' + escapeHtml(r.reason || '') + '</div>';
      var cands = (r.candidates || []).length
        ? '<div class="empty-note" style="padding:2px 0 6px;line-height:1.5">Все уместные поводы: ' + r.candidates.map(function(c){ return escapeHtml(c.intent) + ' (' + escapeHtml(c.scenario) + ', вес ' + c.priority + ')'; }).join(' → ') + '</div>'
        : '';
      var base = r.baseline
        ? '<div class="empty-note" style="padding:2px 0 6px;line-height:1.5">Твой ритм: днём — ' + escapeHtml(hm(r.baseline.usual_day)) + ', вечером — ' + escapeHtml(hm(r.baseline.usual_evening)) +
          ', первая привычка — ' + escapeHtml(hm(r.baseline.first_habit_minute)) + ' · последние поводы: ' + escapeHtml((r.baseline.recent_scenarios || []).join(', ') || '—') + '</div>'
        : '';
      var reference = r.reference
        ? '<div class="empty-note" style="padding:4px 0 8px;line-height:1.45">📌 Эталон: ' + escapeHtml(r.reference) + '</div>'
        : '';
      out.innerHTML =
        '<div class="list-row"><div class="list-row-name"><b>' + escapeHtml(r.title) + '</b>' +
          '<small>повод: ' + escapeHtml(r.intent || '—') + ' (' + escapeHtml(r.scenario || 'тишина') + ') · ' + escapeHtml(r.reason || '') + ' · текст: ' + (r.source === 'llm' ? 'от модели' : r.source === 'fallback' ? 'запасной (без модели)' : '—') + '</small></div></div>' +
        '<div class="empty-note" style="padding:6px 0;line-height:1.5">' + facts + '</div>' + decisions + bubble +
        cands + base + reference + (r.text ? '<div class="btn-row" style="gap:6px;flex-wrap:wrap">' +
          '<button class="btn" id="adamAgain">🔄 Ещё вариант</button>' +
          '<button class="btn" id="adamFallback">🧯 Запасной текст</button>' +
          '<button class="btn btn-accent" id="adamSend">📲 Отправить мне</button>' +

  // ---------- Доступ: временный на 3/7/14 дней, подарочные дни, триал для аккаунта (db/access.py) ----------
  function pad2(n){ return (n < 10 ? '0' : '') + n; }

  function fmtDate(iso){
    if (!iso) return '—';
    var s = String(iso).replace(' ', 'T');
    var d = new Date(/[zZ]|[+-]\d\d:?\d\d$/.test(s) ? s : s + 'Z');
    if (isNaN(d.getTime())) return '—';
    return pad2(d.getDate()) + '.' + pad2(d.getMonth() + 1) + ' ' + pad2(d.getHours()) + ':' + pad2(d.getMinutes());
  }

  var ACCESS_ACTIONS = {
    grant: 'выдан доступ', gift: 'подарок', unlimited: 'снято ограничение', trial_on: 'включён триал', trial_restart: 'триал заново'
  };
  var MODE_SHORT = { open: 'свободный', timed: 'временный', trial: 'триал' };

  function accessHtml(u){
    var a = u.access || {};
    var state = a.allowed ? '<span class="badge badge-ok">доступ открыт</span>' : '<span class="badge badge-bad">доступ закрыт</span>';
    var until;
    if (a.mode === 'open') until = 'без ограничений';
    else if (a.free_end) until = 'до ' + fmtDate(a.free_end) + (a.days_left ? ' · осталось ' + a.days_left + ' дн.' : ' · закончился');
    else until = '—';
    var paid = a.paid_active ? ('<div class="empty-note" style="padding:2px 0">💳 Подписка оплачена до ' + fmtDate(a.paid_until) + ' — подарочные дни сдвинут и срок списания</div>') : '';
    var trial = a.mode === 'trial' ? ('<div class="empty-note" style="padding:2px 0">Триал: день ' + (a.trial_day || 1) + ' из ' + (a.trial_days_total || 3) + '</div>') : '';
    var log = (u.access_log || []).slice(0, 5).map(function(l){
      var days = l.days ? ' ' + l.days + ' дн.' : '';
      return '<div class="empty-note" style="padding:1px 0">' + fmtDate(l.created_at) + ' · ' + escapeHtml(ACCESS_ACTIONS[l.action] || l.action) + days +
        ' (' + escapeHtml(MODE_SHORT[l.mode_before] || '—') + ' → ' + escapeHtml(MODE_SHORT[l.mode_after] || '—') + ')</div>';
    }).join('');
    function row(title, action, values, cls){
      return '<div class="empty-note" style="padding:8px 0 4px">' + title + '</div><div class="btn-row">' +
        values.map(function(d){
          return '<button class="btn ' + (cls || '') + '" data-access="' + action + '" data-days="' + d + '">' + (action === 'gift' ? '+' : '') + d + ' дн.</button>';
        }).join('') + '</div>';
    }
    return '<div class="section-label" style="margin:16px 2px 8px">Доступ</div>' +
      '<div class="user-card-head" style="margin-bottom:6px"><div><b>' + escapeHtml(a.mode_label || '—') + '</b><div class="empty-note" style="padding:2px 0">' + until + '</div></div>' + state + '</div>' +
      trial + paid +
      row('Временный доступ (тестировщику)', 'grant', [3, 7, 14], 'btn-accent') +
      row('Подарить дни (платящему или после триала)', 'gift', [3, 7, 14, 30], 'btn-gold') +
      '<div class="empty-note" style="padding:8px 0 4px">Сценарий триала для этого аккаунта (проверка с нового аккаунта)</div>' +
      '<div class="btn-row">' +
        '<button class="btn" data-access="trial_on">▶ Включить триал</button>' +
        '<button class="btn" data-access="trial_restart">↺ Триал заново</button>' +
        '<button class="btn" data-access="unlimited">∞ Без ограничений</button>' +
      '</div>' +
      '<label class="empty-note" style="display:flex;gap:8px;align-items:center;padding:8px 0 0"><input type="checkbox" id="accessReset"> с триалом — показать онбординг заново</label>' +
      '<label class="empty-note" style="display:flex;gap:8px;align-items:center;padding:4px 0 0"><input type="checkbox" id="accessNotify" checked> написать человеку о выданных днях</label>' +
      (log ? '<div class="empty-note" style="padding:10px 0 2px">Журнал:</div>' + log : '');
  }

  function bindAccess(u){
    var box = document.getElementById('accessSection');
    if (!box) return;
    box.querySelectorAll('[data-access]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var action = btn.dataset.access;
        var days = btn.dataset.days ? parseInt(btn.dataset.days, 10) : null;
        var question = {
          grant: 'Выдать временный доступ на ' + days + ' дн.?',
          gift: 'Подарить ' + days + ' дн.?',
          unlimited: 'Снять ограничения? Человек снова будет входить свободно, без триала и срока.',
          trial_on: 'Включить сценарий триала для этого аккаунта?',
          trial_restart: 'Начать триал этого аккаунта заново (с дня 1)?'
        }[action];
        if (!window.confirm(question)) return;
        accessAction(u.telegram_id, action, days);
      });
    });
  }

  async function accessAction(id, action, days){
    var reset = document.getElementById('accessReset');
    var notify = document.getElementById('accessNotify');
    try{
      var res = await api('/api/admin/user/' + id + '/access', { method: 'POST', body: JSON.stringify({
        action: action, days: days, notify: notify ? notify.checked : true, reset_onboarding: !!(reset && reset.checked && action.indexOf('trial') === 0)
      })});
      haptic('medium');
      showToast(res.notified ? 'Готово ✅ Человеку написали' : 'Готово ✅');
      renderUserCard(await api('/api/admin/user/' + id));
      loadAccessOverview();
    }catch(e){
      var code = e && e.data && e.data.error;
      showToast(code === 'unlimited' ? 'У человека доступ без ограничений — подарок не нужен' : (code === 'invalid_days' ? 'Такого срока нет' : 'Ошибка'));
    }
  }

  async function loadAccessOverview(){
    var box = document.getElementById('accessOverviewBox');

  // ---------- Путь человека и воронка (db/tracking.py) ----------
  function fmtSec(sec){
    sec = Math.round(Number(sec) || 0);
    if (sec < 60) return sec + ' с';
    var m = Math.floor(sec / 60);
    if (m < 60) return m + ' мин' + (sec % 60 ? ' ' + (sec % 60) + ' с' : '');
    return Math.floor(m / 60) + ' ч ' + (m % 60) + ' мин';
  }

  function fmtMin(min){
    if (min == null) return '';
    if (min < 1) return 'сразу';
    if (min < 60) return 'через ' + min + ' мин';
    if (min < 1440) return 'через ' + Math.floor(min / 60) + ' ч' + (min % 60 ? ' ' + (min % 60) + ' мин' : '');
    return 'через ' + Math.floor(min / 1440) + ' дн.' + (Math.floor((min % 1440) / 60) ? ' ' + Math.floor((min % 1440) / 60) + ' ч' : '');
  }

  function metaText(meta){
    if (!meta) return '';
    if (meta.text) return ' · «' + escapeHtml(meta.text) + '»';
    if (meta.title) return ' · «' + escapeHtml(meta.title) + '»';
    if (meta.exit) return ' · ' + escapeHtml(meta.exit);
    if (meta.how) return ' · ' + escapeHtml(meta.how === 'button' ? 'кнопкой' : 'текстом');
    return '';
  }

        var since = m.minutes != null && m.key !== 'registered' ? ' · ' + fmtMin(m.minutes) + (m.minutes_since_open != null && m.key !== 'approved' && m.key !== 'survey' ? ' (' + fmtMin(m.minutes_since_open) + ' после первого захода)' : '') : '';

          '<div class="list-row-name"><b style="font-weight:' + (done ? 700 : 500) + ';color:' + (done ? '#fff' : '#8d879f') + '">' + escapeHtml(m.label) + '</b>' +

          '<small>' + (x.last_action ? 'вышел после «' + escapeHtml(x.last_action) + '»' + (x.last_screen ? ' · экран «' + escapeHtml(x.last_screen) + '»' : '') : 'без действий') + (chain ? '<br>' + chain : '') + '</small></div></div>';
      }).join('');
      var timeline = (d.timeline || []).map(function(t){
        var detail = t.kind === 'session' ? metaText(t.meta) : (metaText(t.meta) || (t.step ? ' · ' + escapeHtml(t.step) : ''));
        return '<div class="list-row" style="padding:5px 2px;align-items:flex-start"><span style="width:22px">' + escapeHtml(t.icon) + '</span>' +
          '<div class="list-row-name"><b style="font-weight:600">' + escapeHtml(t.label) + '</b><small>' + fmtDate(t.at) + detail + (t.screen && t.kind === 'event' ? ' · ' + escapeHtml(t.screen) : '') + '</small></div></div>';

        (exits ? '<div class="empty-note" style="padding:2px 0">Чаще всего выходит после: ' + exits + '</div>' : '') +

        '<div class="empty-note" style="padding:10px 0 2px">Лента действий</div>' + (timeline || '<div class="empty-note">Пока пусто</div>');

  // ---------- Расход ИИ (db/ai_usage.py): по людям и функциям, ограничения ----------
  function fmtTok(n){
    n = Number(n) || 0;
    if (n >= 1000000) return (n / 1000000).toFixed(n >= 10000000 ? 0 : 1).replace('.0', '') + 'M';
    if (n >= 1000) return (n / 1000).toFixed(n >= 100000 ? 0 : 1).replace('.0', '') + 'k';
    return String(n);
  }

  function shortDay(iso){
    var m = /^\d{4}-(\d{2})-(\d{2})/.exec(iso || '');
    return m ? m[2] + '.' + m[1] : '';
  }

  function barsHtml(series){
    var max = Math.max.apply(null, (series || []).map(function(s){ return s.tokens; }).concat([1]));
    return '<div style="display:flex;align-items:flex-end;gap:3px;height:38px;margin:6px 0">' + (series || []).map(function(s){
      var h = Math.max(3, Math.round(34 * s.tokens / max));
      return '<i title="' + escapeHtml(s.day) + ': ' + fmtTok(s.tokens) + '" style="flex:1;min-width:4px;height:' + h + 'px;border-radius:3px;background:linear-gradient(180deg,#a78bfa,#6847dc)"></i>';
    }).join('') + '</div>';
  }

  function featureRows(list, total){
    return (list || []).map(function(f){
      var share = total ? Math.round(100 * f.tokens / total) : 0;
      return '<div style="margin:5px 0"><div style="display:flex;justify-content:space-between;font-size:12px"><span>' + escapeHtml(f.label) + '</span>' +
        '<span><b>' + fmtTok(f.tokens) + '</b> · ' + f.calls + ' выз.' + (total ? ' · ' + share + '%' : '') + '</span></div>' +
        '<div style="height:4px;border-radius:3px;background:rgba(255,255,255,.07)"><div style="height:4px;border-radius:3px;width:' + Math.max(2, share) + '%;background:#8f72ff"></div></div></div>';
    }).join('');
  }

      barsHtml(a.series) + featureRows(a.by_feature, a.week) +

      '<div class="btn-row" style="margin-top:8px"><button class="btn btn-accent" data-ai-limit="unblock">↺ Вернуть ИИ</button><button class="btn" data-ai-limit="day_limit" data-value="">Снять лимит</button></div>';

  function bindAiUsage(u){
    var box = document.getElementById('aiSection');
    if (!box) return;
    box.querySelectorAll('[data-ai-limit]').forEach(function(btn){
      btn.addEventListener('click', async function(){
        var action = btn.dataset.aiLimit;
        var value = btn.dataset.value;
        var body = { action: action };
        if (action === 'block') body.hours = parseInt(value, 10);
        if (action === 'day_limit') body.tokens = value ? parseInt(value, 10) : null;
        var text = { block: 'Отключить ИИ для этого человека на ' + btn.textContent + '?', day_limit: value ? 'Поставить дневной лимит ' + btn.textContent + ' токенов?' : 'Снять личный лимит?', unblock: 'Вернуть ИИ?' }[action];
        if (!window.confirm(text)) return;
        try{
          await api('/api/admin/user/' + u.telegram_id + '/ai-limit', { method: 'POST', body: JSON.stringify(body) });
          haptic('medium');
          showToast('Готово ✅');
          renderUserCard(await api('/api/admin/user/' + u.telegram_id));
          loadAiUsage(7);
        }catch(e){ showToast('Ошибка'); }
      });
    });
  }

  async function giveXp(id, amount){
    try{
      await api('/api/admin/user/' + id + '/xp', { method: 'POST', body: JSON.stringify({ amount: amount }) });
      haptic('medium');
      showToast('+' + amount + ' Adam Coin начислено');
      var u = await api('/api/admin/user/' + id);
      renderUserCard(u);
    }catch(e){ showToast('Ошибка'); }
  }

  async function sendBroadcast(){
    var textEl = document.getElementById('broadcastText');
    var tagEl = document.getElementById('broadcastTag');
    var segmentEl = document.getElementById('broadcastSegment');
    var btn = document.getElementById('broadcastBtn');
    var text = (textEl.value || '').trim();
    if (!text){ showToast('Пустой текст'); return; }

    var segment = segmentEl.value || '';
    var tag = (tagEl.value || '').trim();
    // Roadmap #43 — сегмент приоритетнее тега, если оба заданы (тег
    // тогда просто игнорируется бэкендом же).
    var target = segment
      ? ('сегменту «' + segmentEl.options[segmentEl.selectedIndex].textContent + '»')
      : (tag ? ('по тегу «' + tag + '»') : 'всем пользователям');
    var ok = window.confirm('Отправить это сообщение ' + target + '? Отменить рассылку после отправки нельзя.');
    if (!ok) return;

    btn.disabled = true;
    btn.textContent = '⏳ Отправляю…';
    try{
      var data = await api('/api/admin/broadcast', {
        method: 'POST',
        body: JSON.stringify({ text: text, tag: tag || null, segment: segment || null }),
      });
      haptic('medium');
      showToast('✅ Отправлено: ' + data.success + ', ошибок: ' + data.failed);
      textEl.value = '';
      tagEl.value = '';
      segmentEl.value = '';
    }catch(e){
      showToast('Не получилось отправить');
    }finally{
      btn.disabled = false;
      btn.innerHTML = '📢 Отправить';
    }
  }

  async function boot(){
    if (!initData()){
      renderGate('Открой эту страницу внутри Telegram', true);
      return;
    }
    try{
      var stats = await api('/api/admin/stats');
      renderPanel(stats);
    }catch(e){
      if (e.status === 403){
        renderGate('⛔ Доступ только для администраторов', true);
      } else {
        renderGate('Не получилось загрузить панель', true);
      }
    }
  }

  boot();
})();
</script>
</body>
</html>
