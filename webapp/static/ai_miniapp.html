<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Наставник</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        /* ----- Базовые сбросы и переменные ----- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        :root {
            --bg: var(--tg-color-bg, #ffffff);
            --text: var(--tg-color-text, #000000);
            --hint: var(--tg-color-hint, #999999);
            --link: var(--tg-color-link, #2481cc);
            --button: var(--tg-color-button, #2481cc);
            --button-text: var(--tg-color-button-text, #ffffff);
            --secondary: var(--tg-color-secondary-bg, #f4f6fa);
            --shadow: 0 4px 12px rgba(0,0,0,0.08);
            --radius: 16px;
            --transition: 0.25s ease;
        }
        html, body {
            width: 100%;
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            background: var(--bg);
            color: var(--text);
            overflow: hidden;
        }
        /* ----- Основной контейнер ----- */
        #app {
            display: flex;
            flex-direction: column;
            height: 100vh;
            max-width: 480px;
            margin: 0 auto;
            background: var(--bg);
            position: relative;
        }
        /* ----- Шапка ----- */
        .header {
            padding: 16px 20px 12px;
            background: linear-gradient(135deg, var(--button), #1a6bb0);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--hint);
            flex-shrink: 0;
            box-shadow: 0 2px 8px rgba(0,0,0,0.12);
            border-radius: 0 0 20px 20px;
        }
        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(255,255,255,0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255,255,255,0.3);
        }
        .header-title {
            font-size: 18px;
            font-weight: 600;
            letter-spacing: 0.3px;
            text-shadow: 0 1px 2px rgba(0,0,0,0.1);
        }
        .header-sub {
            font-size: 12px;
            opacity: 0.85;
            font-weight: 400;
            display: block;
            margin-top: 2px;
        }
        .header-actions {
            display: flex;
            gap: 8px;
        }
        .icon-btn {
            background: rgba(255,255,255,0.15);
            border: none;
            border-radius: 50%;
            width: 38px;
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            cursor: pointer;
            transition: var(--transition);
            color: #fff;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255,255,255,0.15);
        }
        .icon-btn:hover {
            background: rgba(255,255,255,0.3);
            transform: scale(1.05);
        }
        .icon-btn:active {
            transform: scale(0.92);
        }
        /* ----- Область сообщений ----- */
        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 16px 16px 8px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            scroll-behavior: smooth;
        }
        .messages::-webkit-scrollbar {
            width: 4px;
        }
        .messages::-webkit-scrollbar-track {
            background: transparent;
        }
        .messages::-webkit-scrollbar-thumb {
            background: var(--hint);
            border-radius: 4px;
        }

        /* ----- Сообщения ----- */
        .message {
            padding: 12px 16px;
            border-radius: var(--radius);
            max-width: 85%;
            word-wrap: break-word;
            animation: slideUp 0.3s ease;
            line-height: 1.5;
            position: relative;
            box-shadow: var(--shadow);
            font-size: 15px;
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .message.user {
            align-self: flex-end;
            background: var(--button);
            color: var(--button-text);
            border-bottom-right-radius: 4px;
        }
        .message.assistant {
            align-self: flex-start;
            background: var(--secondary);
            color: var(--text);
            border-bottom-left-radius: 4px;
        }
        .message.error {
            align-self: center;
            background: #ff3b30;
            color: #fff;
            border-radius: var(--radius);
            max-width: 90%;
            text-align: center;
        }
        .timestamp {
            font-size: 10px;
            opacity: 0.6;
            margin-top: 6px;
            text-align: right;
            letter-spacing: 0.3px;
        }
        .message.user .timestamp {
            color: rgba(255,255,255,0.7);
        }
        .message.assistant .timestamp {
            color: var(--hint);
        }

        /* ----- Индикатор загрузки (печатает) ----- */
        .typing-indicator {
            align-self: flex-start;
            background: var(--secondary);
            padding: 12px 18px;
            border-radius: var(--radius);
            border-bottom-left-radius: 4px;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: var(--shadow);
            animation: slideUp 0.3s ease;
        }
        .typing-dots {
            display: flex;
            gap: 4px;
        }
        .typing-dots span {
            width: 8px;
            height: 8px;
            background: var(--hint);
            border-radius: 50%;
            display: inline-block;
            animation: bounce 1.4s infinite both;
        }
        .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
        .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0.4); opacity: 0.4; }
            40% { transform: scale(1); opacity: 1; }
        }
        .typing-text {
            font-size: 14px;
            color: var(--hint);
        }

        /* ----- Предупреждение о троттлинге ----- */
        .throttle {
            background: #ff9500;
            color: #fff;
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 13px;
            text-align: center;
            align-self: center;
            box-shadow: var(--shadow);
            animation: slideUp 0.3s ease;
        }

        /* ----- Пустое состояние ----- */
        .empty {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            opacity: 0.7;
            text-align: center;
            padding: 40px 20px;
            gap: 12px;
        }
        .empty-icon {
            font-size: 72px;
            margin-bottom: 8px;
            filter: drop-shadow(0 4px 12px rgba(0,0,0,0.06));
        }
        .empty-text {
            font-size: 16px;
            font-weight: 500;
        }
        .empty-sub {
            font-size: 14px;
            color: var(--hint);
        }

        /* ----- Ввод ----- */
        .input-area {
            border-top: 1px solid var(--hint);
            padding: 12px 16px 16px;
            display: flex;
            gap: 10px;
            align-items: flex-end;
            background: var(--bg);
            flex-shrink: 0;
            backdrop-filter: blur(8px);
        }
        .input-area textarea {
            flex: 1;
            resize: none;
            padding: 12px 16px;
            border-radius: 24px;
            border: 1px solid var(--hint);
            background: var(--secondary);
            color: var(--text);
            font-size: 15px;
            font-family: inherit;
            outline: none;
            transition: var(--transition);
            min-height: 44px;
            max-height: 120px;
            line-height: 1.4;
        }
        .input-area textarea:focus {
            border-color: var(--button);
            background: var(--bg);
            box-shadow: 0 0 0 3px rgba(36, 129, 204, 0.15);
        }
        .input-area textarea::placeholder {
            color: var(--hint);
        }
        .input-area button {
            background: var(--button);
            color: var(--button-text);
            border: none;
            border-radius: 50%;
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            cursor: pointer;
            transition: var(--transition);
            flex-shrink: 0;
            box-shadow: 0 2px 8px rgba(36, 129, 204, 0.3);
        }
        .input-area button:hover:not(:disabled) {
            transform: scale(1.05);
            box-shadow: 0 4px 12px rgba(36, 129, 204, 0.4);
        }
        .input-area button:active:not(:disabled) {
            transform: scale(0.92);
        }
        .input-area button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            box-shadow: none;
        }
        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid var(--button-text);
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ----- Адаптация под тёмную тему ----- */
        @media (prefers-color-scheme: dark) {
            .header {
                background: linear-gradient(135deg, #1a3a5c, #0f2a44);
            }
        }
    </style>
</head>
<body>
<div id="app">
    <!-- Шапка -->
    <div class="header">
        <div class="header-left">
            <div class="avatar">🧠</div>
            <div>
                <div class="header-title">AI Наставник</div>
                <span class="header-sub">Project ADAM</span>
            </div>
        </div>
        <div class="header-actions">
            <button class="icon-btn" id="tipBtn" title="Совет дня">💡</button>
            <button class="icon-btn" id="clearBtn" title="Очистить историю">🗑️</button>
        </div>
    </div>

    <!-- Область сообщений -->
    <div class="messages" id="messages"></div>

    <!-- Поле ввода -->
    <div class="input-area">
        <textarea id="input" rows="1" placeholder="Напиши сообщение..." style="min-height:44px;"></textarea>
        <button id="sendBtn">➤</button>
    </div>
</div>

<script>
    (function() {
        // ----- Инициализация Telegram WebApp -----
        const tg = window.Telegram.WebApp;
        tg.ready();

        function applyTheme() {
            const isDark = tg.colorScheme === 'dark';
            const root = document.documentElement;
            root.style.setProperty('--bg', tg.backgroundColor || (isDark ? '#1a1a1a' : '#ffffff'));
            root.style.setProperty('--text', tg.textColor || (isDark ? '#ffffff' : '#000000'));
            root.style.setProperty('--hint', tg.hintColor || (isDark ? '#777777' : '#cccccc'));
            root.style.setProperty('--link', tg.linkColor || '#2481cc');
            root.style.setProperty('--button', tg.buttonColor || '#2481cc');
            root.style.setProperty('--button-text', tg.buttonTextColor || '#ffffff');
            root.style.setProperty('--secondary', isDark ? '#2a2a2a' : '#f4f6fa');
        }
        applyTheme();
        tg.onEvent('themeChanged', applyTheme);

        // ----- DOM-элементы -----
        const messagesEl = document.getElementById('messages');
        const inputField = document.getElementById('input');
        const sendBtn = document.getElementById('sendBtn');
        const tipBtn = document.getElementById('tipBtn');
        const clearBtn = document.getElementById('clearBtn');
        const initData = tg.initData || '';

        let isLoading = false;
        let throttleTimer = null;

        // ----- Вспомогательные функции -----
        function addMessage(text, role, extraClass = '') {
            const div = document.createElement('div');
            div.className = 'message ' + role + (extraClass ? ' ' + extraClass : '');
            // Поддержка переносов строк
            div.innerHTML = text.replace(/\n/g, '<br>');
            const time = document.createElement('div');
            time.className = 'timestamp';
            time.textContent = new Date().toLocaleTimeString('ru-RU', { hour:'2-digit', minute:'2-digit' });
            div.appendChild(time);
            messagesEl.appendChild(div);
            messagesEl.scrollTop = messagesEl.scrollHeight;
        }

        function showTyping() {
            const div = document.createElement('div');
            div.className = 'typing-indicator';
            div.id = 'typingIndicator';
            div.innerHTML = `
                <div class="typing-dots">
                    <span></span><span></span><span></span>
                </div>
                <span class="typing-text">Наставник печатает</span>
            `;
            messagesEl.appendChild(div);
            messagesEl.scrollTop = messagesEl.scrollHeight;
        }

        function hideTyping() {
            const el = document.getElementById('typingIndicator');
            if (el) el.remove();
        }

        function showThrottle(seconds) {
            const div = document.createElement('div');
            div.className = 'throttle';
            div.id = 'throttleMsg';
            div.textContent = '⏳ Подожди ' + seconds + ' сек.';
            messagesEl.appendChild(div);
            messagesEl.scrollTop = messagesEl.scrollHeight;
            setTimeout(() => {
                const el = document.getElementById('throttleMsg');
                if (el) el.remove();
            }, seconds * 1000);
        }

        function clearInput() {
            inputField.value = '';
            inputField.style.height = 'auto';
        }

        // ----- Отправка сообщения -----
        async function sendMessage() {
            const text = inputField.value.trim();
            if (!text || isLoading || throttleTimer) return;

            if (!initData) {
                addMessage('❌ Авторизация не пройдена. Откройте приложение через Telegram.', 'assistant', 'error');
                return;
            }

            addMessage(text, 'user');
            clearInput();
            isLoading = true;
            sendBtn.disabled = true;
            showTyping();

            try {
                const response = await fetch('/api/ai/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Telegram-Init-Data': initData
                    },
                    body: JSON.stringify({ message: text })
                });

                if (!response.ok) {
                    let errorMsg = 'Ошибка сервера (код ' + response.status + ')';
                    if (response.status === 401) {
                        errorMsg = '❌ Ошибка авторизации. Перезапустите приложение.';
                    } else if (response.status === 429) {
                        try {
                            const data = await response.json();
                            const seconds = data.wait_seconds || 5;
                            throttleTimer = true;
                            showThrottle(seconds);
                            setTimeout(() => { throttleTimer = false; }, seconds * 1000);
                            errorMsg = '⏳ Подожди ' + seconds + ' сек.';
                        } catch (_) {
                            errorMsg = '⏳ Слишком много запросов. Подождите.';
                        }
                    } else {
                        try {
                            const data = await response.json();
                            if (data.message) errorMsg = data.message;
                        } catch (_) {}
                    }
                    hideTyping();
                    addMessage(errorMsg, 'assistant', 'error');
                    return;
                }

                const data = await response.json();
                const reply = data.reply || 'Пустой ответ';
                hideTyping();
                addMessage(reply, 'assistant');

            } catch (err) {
                console.error(err);
                hideTyping();
                addMessage('❌ Ошибка сети. Проверьте интернет.', 'assistant', 'error');
            } finally {
                isLoading = false;
                sendBtn.disabled = false;
                inputField.focus();
            }
        }

        // ----- Совет дня -----
        async function getTip() {
            if (!initData) {
                addMessage('❌ Авторизация не пройдена.', 'assistant', 'error');
                return;
            }
            if (isLoading) return;
            isLoading = true;
            sendBtn.disabled = true;
            showTyping();

            try {
                const response = await fetch('/api/ai/tip', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Telegram-Init-Data': initData
                    }
                });
                hideTyping();
                if (!response.ok) {
                    addMessage('❌ Не удалось получить совет (код ' + response.status + ')', 'assistant', 'error');
                    return;
                }
                const data = await response.json();
                addMessage('💡 <b>Совет дня</b>\n\n' + data.tip, 'assistant');
            } catch (e) {
                hideTyping();
                addMessage('❌ Ошибка сети', 'assistant', 'error');
            } finally {
                isLoading = false;
                sendBtn.disabled = false;
            }
        }

        // ----- Очистка истории (локально) -----
        function clearHistory() {
            if (messagesEl.children.length <= 1) return;
            const confirm = tg.showPopup ? tg.showPopup({
                title: 'Очистить историю?',
                message: 'Все сообщения будут удалены из чата (только локально).',
                buttons: [
                    { type: 'cancel' },
                    { type: 'ok', text: 'Очистить' }
                ]
            }, (btn) => {
                if (btn === 'ok') {
                    messagesEl.innerHTML = '';
                    addMessage('👋 История очищена. Задай новый вопрос!', 'assistant');
                }
            }) : (() => {
                if (confirm('Очистить историю чата?')) {
                    messagesEl.innerHTML = '';
                    addMessage('👋 История очищена. Задай новый вопрос!', 'assistant');
                }
            })();
        }

        // ----- Обработчики -----
        sendBtn.addEventListener('click', sendMessage);
        inputField.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });
        inputField.addEventListener('input', () => {
            inputField.style.height = 'auto';
            inputField.style.height = inputField.scrollHeight + 'px';
        });

        tipBtn.addEventListener('click', getTip);
        clearBtn.addEventListener('click', clearHistory);

        // Приветствие
        if (initData) {
            addMessage('👋 Привет! Я твой персональный наставник по привычкам. Задай вопрос или расскажи о своих целях.', 'assistant');
        } else {
            addMessage('🔐 Для начала работы откройте это приложение через Telegram.', 'assistant', 'error');
        }

        // Фокус на вводе
        inputField.focus();
    })();
</script>
</body>
</html>
