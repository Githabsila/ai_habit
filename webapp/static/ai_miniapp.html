<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Наставник</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        html, body { width:100%; height:100%; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--tg-color-bg, #ffffff); color: var(--tg-color-text, #000000); }
        #app { display:flex; flex-direction:column; height:100vh; }
        .header { padding:16px; border-bottom:1px solid var(--tg-color-hint, #cccccc); display:flex; justify-content:space-between; align-items:center; }
        .header-title { font-size:18px; font-weight:600; }
        .messages { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:8px; }
        .message { padding:12px 16px; border-radius:12px; max-width:85%; word-wrap:break-word; animation:fadeIn 0.3s; }
        @keyframes fadeIn { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }
        .message.user { align-self:flex-end; background:var(--tg-color-button, #2481cc); color:var(--tg-color-button-text, #ffffff); }
        .message.assistant { align-self:flex-start; background:var(--tg-color-secondary-bg, #f0f0f0); color:var(--tg-color-text, #000000); }
        .message.error { align-self:center; background:#ff3b30; color:white; }
        .input-area { border-top:1px solid var(--tg-color-hint, #cccccc); padding:12px; display:flex; gap:8px; }
        .input-area textarea { flex:1; resize:none; padding:10px; border-radius:8px; border:1px solid var(--tg-color-hint, #cccccc); background:var(--tg-color-bg, #ffffff); color:var(--tg-color-text, #000000); font-size:14px; outline:none; }
        .input-area textarea:focus { border-color:var(--tg-color-button, #2481cc); }
        .input-area button { background:var(--tg-color-button, #2481cc); color:var(--tg-color-button-text, #ffffff); border:none; border-radius:8px; padding:10px 16px; cursor:pointer; font-size:14px; }
        .input-area button:disabled { opacity:0.5; cursor:not-allowed; }
        .spinner { display:inline-block; width:14px; height:14px; border:2px solid var(--tg-color-button-text, #ffffff); border-top-color:transparent; border-radius:50%; animation:spin 0.8s linear infinite; }
        @keyframes spin { to { transform:rotate(360deg); } }
        .empty { text-align:center; opacity:0.6; padding:40px; }
        .empty-icon { font-size:64px; margin-bottom:16px; }
        .throttle { background:#ff9500; color:white; padding:8px 12px; border-radius:6px; font-size:12px; text-align:center; margin-bottom:8px; }
        .loading { display:flex; align-items:center; gap:8px; padding:12px; background:var(--tg-color-secondary-bg, #f0f0f0); border-radius:12px; max-width:200px; align-self:flex-start; }
        .timestamp { font-size:11px; opacity:0.7; margin-top:4px; }
        .tip-button { background:transparent; border:none; font-size:20px; cursor:pointer; color:var(--tg-color-button, #2481cc); }
    </style>
</head>
<body>
<div id="app">
    <div class="header">
        <div class="header-title">🤖 AI Наставник</div>
        <button class="tip-button" id="tipBtn" title="Совет дня">💡</button>
    </div>
    <div class="messages" id="messages"></div>
    <div class="input-area">
        <textarea id="input" rows="1" placeholder="Напиши сообщение..." style="min-height:40px;"></textarea>
        <button id="sendBtn">➤</button>
    </div>
</div>

<script>
    (function() {
        // ----- инициализация Telegram WebApp -----
        const tg = window.Telegram.WebApp;
        tg.ready();

        function applyTheme() {
            const isDark = tg.colorScheme === 'dark';
            const root = document.documentElement;
            root.style.setProperty('--tg-color-bg', tg.backgroundColor || (isDark ? '#1a1a1a' : '#ffffff'));
            root.style.setProperty('--tg-color-text', tg.textColor || (isDark ? '#ffffff' : '#000000'));
            root.style.setProperty('--tg-color-hint', tg.hintColor || (isDark ? '#777777' : '#cccccc'));
            root.style.setProperty('--tg-color-button', tg.buttonColor || '#2481cc');
            root.style.setProperty('--tg-color-button-text', tg.buttonTextColor || '#ffffff');
            root.style.setProperty('--tg-color-secondary-bg', isDark ? '#2a2a2a' : '#f0f0f0');
        }
        applyTheme();
        tg.onEvent('themeChanged', applyTheme);

        // ----- DOM-элементы -----
        const messagesContainer = document.getElementById('messages');
        const inputField = document.getElementById('input');
        const sendBtn = document.getElementById('sendBtn');
        const tipBtn = document.getElementById('tipBtn');

        const initData = tg.initData || '';

        let isLoading = false;
        let throttleTimer = null;
        let throttleSeconds = 0;

        // ----- вспомогательные функции -----
        function addMessage(text, role, extraClass = '') {
            const div = document.createElement('div');
            div.className = 'message ' + role + (extraClass ? ' ' + extraClass : '');
            div.textContent = text;
            // временная метка
            const time = document.createElement('div');
            time.className = 'timestamp';
            time.textContent = new Date().toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
            div.appendChild(time);
            messagesContainer.appendChild(div);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        function showLoading() {
            const div = document.createElement('div');
            div.className = 'loading';
            div.id = 'loadingIndicator';
            div.innerHTML = '<div class="spinner"></div> Думаю...';
            messagesContainer.appendChild(div);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        function hideLoading() {
            const el = document.getElementById('loadingIndicator');
            if (el) el.remove();
        }

        function showThrottle(seconds) {
            const div = document.createElement('div');
            div.className = 'throttle';
            div.id = 'throttleMsg';
            div.textContent = '⏳ Подожди ' + seconds + ' сек. перед следующим сообщением';
            messagesContainer.appendChild(div);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
            // скрыть через секунды
            setTimeout(() => {
                const el = document.getElementById('throttleMsg');
                if (el) el.remove();
            }, seconds * 1000);
        }

        function clearInput() {
            inputField.value = '';
            inputField.style.height = 'auto';
        }

        // ----- отправка сообщения -----
        async function sendMessage() {
            const text = inputField.value.trim();
            if (!text || isLoading || throttleTimer) return;

            addMessage(text, 'user');
            clearInput();
            isLoading = true;
            sendBtn.disabled = true;
            showLoading();

            try {
                const response = await fetch('/api/ai/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Telegram-Init-Data': initData
                    },
                    body: JSON.stringify({ message: text })
                });

                const data = await response.json();

                if (!response.ok) {
                    let errorMsg = data.message || 'Ошибка сервера';
                    if (response.status === 429) {
                        const seconds = data.wait_seconds || 5;
                        throttleTimer = true;
                        throttleSeconds = seconds;
                        showThrottle(seconds);
                        setTimeout(() => {
                            throttleTimer = false;
                        }, seconds * 1000);
                        errorMsg = '⏳ Подожди ' + seconds + ' сек.';
                    } else if (response.status === 401) {
                        errorMsg = '❌ Ошибка аутентификации. Перезапустите приложение.';
                    }
                    addMessage(errorMsg, 'assistant', 'error');
                    return;
                }

                // ожидаем поле reply (как в вашем бэкенде)
                const reply = data.reply || 'Пустой ответ';
                addMessage(reply, 'assistant');

            } catch (err) {
                console.error(err);
                addMessage('❌ Ошибка сети. Проверьте интернет.', 'assistant', 'error');
            } finally {
                hideLoading();
                isLoading = false;
                sendBtn.disabled = false;
                inputField.focus();
            }
        }

        // ----- обработчики -----
        sendBtn.addEventListener('click', sendMessage);
        inputField.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });
        // автоматическая высота textarea
        inputField.addEventListener('input', () => {
            inputField.style.height = 'auto';
            inputField.style.height = inputField.scrollHeight + 'px';
        });

        // совет дня (заглушка)
        tipBtn.addEventListener('click', async function() {
            try {
                const resp = await fetch('/api/ai/tip', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Telegram-Init-Data': initData
                    }
                });
                const data = await resp.json();
                if (resp.ok) {
                    addMessage('💡 Совет дня:\n' + data.tip, 'assistant');
                } else {
                    addMessage('❌ Не удалось получить совет', 'assistant', 'error');
                }
            } catch (e) {
                addMessage('❌ Ошибка сети', 'assistant', 'error');
            }
        });

        // приветствие
        addMessage('👋 Привет! Я твой AI-наставник. Задай вопрос или расскажи о привычках.', 'assistant');
    })();
</script>
</body>
</html>
