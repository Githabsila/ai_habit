<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Наставник</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        /* ---------- Общие переменные ---------- */
        :root {
            --bg-primary: #0b1a2e;
            --bg-secondary: rgba(255, 255, 255, 0.06);
            --bg-card: rgba(255, 255, 255, 0.08);
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.7);
            --text-muted: rgba(255, 255, 255, 0.4);
            --accent: #4a9eff;
            --accent-dim: rgba(74, 158, 255, 0.2);
            --border: rgba(255, 255, 255, 0.08);
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            --radius: 16px;
            --radius-sm: 10px;
            --transition: 0.25s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            overflow: hidden;
        }

        /* ---------- Основной контейнер ---------- */
        #app {
            display: flex;
            flex-direction: column;
            height: 100vh;
            max-width: 480px;
            margin: 0 auto;
            background: var(--bg-primary);
            position: relative;
            background-image: radial-gradient(ellipse at 20% 50%, rgba(74, 158, 255, 0.08) 0%, transparent 60%),
                              radial-gradient(ellipse at 80% 20%, rgba(100, 80, 255, 0.06) 0%, transparent 50%);
        }

        /* ---------- Шапка ---------- */
        .header {
            padding: 16px 20px 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
            background: rgba(11, 26, 46, 0.8);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: var(--accent-dim);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .header-info {
            display: flex;
            flex-direction: column;
        }

        .header-title {
            font-size: 17px;
            font-weight: 600;
            letter-spacing: 0.3px;
        }

        .header-sub {
            font-size: 12px;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .header-sub .dot {
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: #4caf50;
            display: inline-block;
        }

        .header-actions {
            display: flex;
            gap: 6px;
        }

        .icon-btn {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 50%;
            width: 38px;
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            cursor: pointer;
            transition: var(--transition);
            color: var(--text-secondary);
            backdrop-filter: blur(4px);
        }

        .icon-btn:hover {
            background: var(--accent-dim);
            color: var(--text-primary);
            border-color: var(--accent);
        }

        .icon-btn:active {
            transform: scale(0.92);
        }

        /* ---------- Область сообщений ---------- */
        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 16px 16px 8px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            scroll-behavior: smooth;
        }

        .messages::-webkit-scrollbar {
            width: 3px;
        }
        .messages::-webkit-scrollbar-track {
            background: transparent;
        }
        .messages::-webkit-scrollbar-thumb {
            background: var(--text-muted);
            border-radius: 4px;
        }

        /* ---------- Сообщения (карточки) ---------- */
        .message {
            padding: 14px 18px;
            border-radius: var(--radius);
            max-width: 85%;
            word-wrap: break-word;
            animation: slideUp 0.3s ease;
            line-height: 1.5;
            font-size: 15px;
            backdrop-filter: blur(8px);
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user {
            align-self: flex-end;
            background: var(--accent);
            color: #fff;
            border-bottom-right-radius: 4px;
            border-color: var(--accent);
        }

        .message.assistant {
            align-self: flex-start;
            background: var(--bg-card);
            color: var(--text-primary);
            border-bottom-left-radius: 4px;
            backdrop-filter: blur(8px);
        }

        .message.error {
            align-self: center;
            background: rgba(255, 59, 48, 0.2);
            border-color: rgba(255, 59, 48, 0.3);
            color: #ff6b6b;
            border-radius: var(--radius);
            max-width: 90%;
            text-align: center;
            font-size: 14px;
        }

        .timestamp {
            font-size: 10px;
            opacity: 0.5;
            margin-top: 6px;
            text-align: right;
            letter-spacing: 0.3px;
        }

        .message.user .timestamp {
            color: rgba(255, 255, 255, 0.6);
        }
        .message.assistant .timestamp {
            color: var(--text-muted);
        }

        /* ---------- Индикатор печати ---------- */
        .typing-indicator {
            align-self: flex-start;
            background: var(--bg-card);
            padding: 12px 18px;
            border-radius: var(--radius);
            border-bottom-left-radius: 4px;
            display: flex;
            align-items: center;
            gap: 10px;
            border: 1px solid var(--border);
            backdrop-filter: blur(8px);
            box-shadow: var(--shadow);
            animation: slideUp 0.3s ease;
        }

        .typing-dots {
            display: flex;
            gap: 4px;
        }
        .typing-dots span {
            width: 8px;
            height: 8px;
            background: var(--text-muted);
            border-radius: 50%;
            display: inline-block;
            animation: bounce 1.4s infinite both;
        }
        .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
        .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0.4); opacity: 0.4; }
            40% { transform: scale(1); opacity: 1; }
        }
        .typing-text {
            font-size: 14px;
            color: var(--text-secondary);
        }

        /* ---------- Предупреждение о троттлинге ---------- */
        .throttle {
            background: rgba(255, 149, 0, 0.15);
            border: 1px solid rgba(255, 149, 0, 0.3);
            color: #ffb84d;
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 13px;
            text-align: center;
            align-self: center;
            backdrop-filter: blur(8px);
            animation: slideUp 0.3s ease;
        }

        /* ---------- Пустое состояние ---------- */
        .empty {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            text-align: center;
            padding: 40px 20px;
            gap: 12px;
            opacity: 0.8;
        }
        .empty-icon {
            font-size: 64px;
            margin-bottom: 4px;
            filter: drop-shadow(0 4px 20px rgba(74, 158, 255, 0.15));
        }
        .empty-text {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-primary);
        }
        .empty-sub {
            font-size: 14px;
            color: var(--text-secondary);
            max-width: 280px;
        }

        /* ---------- Поле ввода ---------- */
        .input-area {
            border-top: 1px solid var(--border);
            padding: 12px 16px 16px;
            display: flex;
            gap: 10px;
            align-items: flex-end;
            background: rgba(11, 26, 46, 0.8);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            flex-shrink: 0;
        }

        .input-area textarea {
            flex: 1;
            resize: none;
            padding: 12px 16px;
            border-radius: 24px;
            border: 1px solid var(--border);
            background: var(--bg-secondary);
            color: var(--text-primary);
            font-size: 15px;
            font-family: inherit;
            outline: none;
            transition: var(--transition);
            min-height: 44px;
            max-height: 120px;
            line-height: 1.4;
        }

        .input-area textarea::placeholder {
            color: var(--text-muted);
        }

        .input-area textarea:focus {
            border-color: var(--accent);
            background: rgba(255, 255, 255, 0.06);
            box-shadow: 0 0 0 3px var(--accent-dim);
        }

        .input-area button {
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: 50%;
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            cursor: pointer;
            transition: var(--transition);
            flex-shrink: 0;
            box-shadow: 0 4px 16px rgba(74, 158, 255, 0.3);
        }

        .input-area button:hover:not(:disabled) {
            transform: scale(1.05);
            box-shadow: 0 6px 24px rgba(74, 158, 255, 0.4);
        }

        .input-area button:active:not(:disabled) {
            transform: scale(0.92);
        }

        .input-area button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            box-shadow: none;
        }

        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ---------- Нижняя навигация (как на скриншоте) ---------- */
        .bottom-nav {
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 8px 0 12px;
            border-top: 1px solid var(--border);
            background: rgba(11, 26, 46, 0.9);
            backdrop-filter: blur(12px);
            flex-shrink: 0;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 10px;
            cursor: pointer;
            transition: var(--transition);
            padding: 4px 12px;
            font-family: inherit;
            position: relative;
        }

        .nav-item .nav-icon {
            font-size: 22px;
            line-height: 1;
            margin-bottom: 2px;
        }

        .nav-item.active {
            color: var(--accent);
        }

        .nav-item.active::after {
            content: '';
            position: absolute;
            top: -1px;
            left: 50%;
            transform: translateX(-50%);
            width: 20px;
            height: 2px;
            background: var(--accent);
            border-radius: 2px;
        }

        .nav-item:hover {
            color: var(--text-primary);
        }

        /* ---------- Адаптация под тёмную тему Telegram (уже тёмная) ---------- */
        /* Если Telegram передаёт светлую тему, переопределим – но у нас фиксированно тёмная */
        @media (prefers-color-scheme: light) {
            /* Оставляем тёмную тему принудительно, чтобы соответствовать скриншоту */
        }
    </style>
</head>
<body>
<div id="app">
    <!-- Шапка -->
    <div class="header">
        <div class="header-left">
            <div class="avatar">🧠</div>
            <div class="header-info">
                <div class="header-title">AI Наставник</div>
                <div class="header-sub">
                    <span class="dot"></span> онлайн
                </div>
            </div>
        </div>
        <div class="header-actions">
            <button class="icon-btn" id="tipBtn" title="Совет дня">💡</button>
            <button class="icon-btn" id="clearBtn" title="Очистить историю">🗑️</button>
        </div>
    </div>

    <!-- Область сообщений -->
    <div class="messages" id="messages"></div>

    <!-- Поле ввода -->
    <div class="input-area">
        <textarea id="input" rows="1" placeholder="Напиши сообщение..." style="min-height:44px;"></textarea>
        <button id="sendBtn">➤</button>
    </div>

    <!-- Нижняя навигация (как на скриншоте) -->
    <div class="bottom-nav">
        <button class="nav-item" data-tab="home">
            <span class="nav-icon">🏠</span>
            <span>Главная</span>
        </button>
        <button class="nav-item" data-tab="calendar">
            <span class="nav-icon">📅</span>
            <span>Календарь</span>
        </button>
        <button class="nav-item active" data-tab="ai">
            <span class="nav-icon">🤖</span>
            <span>ИИ</span>
        </button>
        <button class="nav-item" data-tab="rating">
            <span class="nav-icon">🏆</span>
            <span>Рейтинг</span>
        </button>
        <button class="nav-item" data-tab="profile">
            <span class="nav-icon">👤</span>
            <span>Профиль</span>
        </button>
    </div>
</div>

<script>
    (function() {
        // ----- Инициализация Telegram WebApp -----
        const tg = window.Telegram.WebApp;
        tg.ready();

        // Принудительно тёмная тема (чтобы соответствовать скриншоту)
        // Но если нужно, можно адаптировать под тему Telegram, но мы оставляем тёмную.

        // ----- DOM-элементы -----
        const messagesEl = document.getElementById('messages');
        const inputField = document.getElementById('input');
        const sendBtn = document.getElementById('sendBtn');
        const tipBtn = document.getElementById('tipBtn');
        const clearBtn = document.getElementById('clearBtn');
        const navItems = document.querySelectorAll('.nav-item');
        const initData = tg.initData || '';

        let isLoading = false;
        let throttleTimer = null;

        // ----- Обработка навигации (переходы по вкладкам) -----
        navItems.forEach(item => {
            item.addEventListener('click', function() {
                // В реальном проекте здесь должен быть переход на соответствующий экран
                // Сейчас просто подсветим активную вкладку
                navItems.forEach(n => n.classList.remove('active'));
                this.classList.add('active');
                // Показать уведомление (заглушка)
                const tab = this.dataset.tab;
                if (tab !== 'ai') {
                    tg.showPopup ? tg.showPopup({
                        title: 'Переход',
                        message: `Вы перешли на вкладку "${this.querySelector('span:last-child').textContent}"`,
                        buttons: [{ type: 'ok' }]
                    }) : alert(`Переход на ${this.querySelector('span:last-child').textContent}`);
                }
            });
        });

        // ----- Вспомогательные функции -----
        function addMessage(text, role, extraClass = '') {
            const div = document.createElement('div');
            div.className = 'message ' + role + (extraClass ? ' ' + extraClass : '');
            div.innerHTML = text.replace(/\n/g, '<br>');
            const time = document.createElement('div');
            time.className = 'timestamp';
            time.textContent = new Date().toLocaleTimeString('ru-RU', { hour:'2-digit', minute:'2-digit' });
            div.appendChild(time);
            messagesEl.appendChild(div);
            messagesEl.scrollTop = messagesEl.scrollHeight;
        }

        function showTyping() {
            const div = document.createElement('div');
            div.className = 'typing-indicator';
            div.id = 'typingIndicator';
            div.innerHTML = `
                <div class="typing-dots">
                    <span></span><span></span><span></span>
                </div>
                <span class="typing-text">Наставник печатает</span>
            `;
            messagesEl.appendChild(div);
            messagesEl.scrollTop = messagesEl.scrollHeight;
        }

        function hideTyping() {
            const el = document.getElementById('typingIndicator');
            if (el) el.remove();
        }

        function showThrottle(seconds) {
            const div = document.createElement('div');
            div.className = 'throttle';
            div.id = 'throttleMsg';
            div.textContent = '⏳ Подожди ' + seconds + ' сек.';
            messagesEl.appendChild(div);
            messagesEl.scrollTop = messagesEl.scrollHeight;
            setTimeout(() => {
                const el = document.getElementById('throttleMsg');
                if (el) el.remove();
            }, seconds * 1000);
        }

        function clearInput() {
            inputField.value = '';
            inputField.style.height = 'auto';
        }

        // ----- Отправка сообщения -----
        async function sendMessage() {
            const text = inputField.value.trim();
            if (!text || isLoading || throttleTimer) return;

            if (!initData) {
                addMessage('❌ Авторизация не пройдена. Откройте приложение через Telegram.', 'assistant', 'error');
                return;
            }

            addMessage(text, 'user');
            clearInput();
            isLoading = true;
            sendBtn.disabled = true;
            showTyping();

            try {
                const response = await fetch('/api/ai/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Telegram-Init-Data': initData
                    },
                    body: JSON.stringify({ message: text })
                });

                if (!response.ok) {
                    let errorMsg = 'Ошибка сервера (код ' + response.status + ')';
                    if (response.status === 401) {
                        errorMsg = '❌ Ошибка авторизации. Перезапустите приложение.';
                    } else if (response.status === 429) {
                        try {
                            const data = await response.json();
                            const seconds = data.wait_seconds || 5;
                            throttleTimer = true;
                            showThrottle(seconds);
                            setTimeout(() => { throttleTimer = false; }, seconds * 1000);
                            errorMsg = '⏳ Подожди ' + seconds + ' сек.';
                        } catch (_) {
                            errorMsg = '⏳ Слишком много запросов. Подождите.';
                        }
                    } else {
                        try {
                            const data = await response.json();
                            if (data.message) errorMsg = data.message;
                        } catch (_) {}
                    }
                    hideTyping();
                    addMessage(errorMsg, 'assistant', 'error');
                    return;
                }

                const data = await response.json();
                const reply = data.reply || 'Пустой ответ';
                hideTyping();
                addMessage(reply, 'assistant');

            } catch (err) {
                console.error(err);
                hideTyping();
                addMessage('❌ Ошибка сети. Проверьте интернет.', 'assistant', 'error');
            } finally {
                isLoading = false;
                sendBtn.disabled = false;
                inputField.focus();
            }
        }

        // ----- Совет дня -----
        async function getTip() {
            if (!initData) {
                addMessage('❌ Авторизация не пройдена.', 'assistant', 'error');
                return;
            }
            if (isLoading) return;
            isLoading = true;
            sendBtn.disabled = true;
            showTyping();

            try {
                const response = await fetch('/api/ai/tip', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Telegram-Init-Data': initData
                    }
                });
                hideTyping();
                if (!response.ok) {
                    addMessage('❌ Не удалось получить совет (код ' + response.status + ')', 'assistant', 'error');
                    return;
                }
                const data = await response.json();
                addMessage('💡 <b>Совет дня</b>\n\n' + data.tip, 'assistant');
            } catch (e) {
                hideTyping();
                addMessage('❌ Ошибка сети', 'assistant', 'error');
            } finally {
                isLoading = false;
                sendBtn.disabled = false;
            }
        }

        // ----- Очистка истории (локально) -----
        function clearHistory() {
            if (messagesEl.children.length <= 1) return;
            const confirmAction = () => {
                messagesEl.innerHTML = '';
                addMessage('👋 История очищена. Задай новый вопрос!', 'assistant');
            };
            if (tg.showPopup) {
                tg.showPopup({
                    title: 'Очистить историю?',
                    message: 'Все сообщения будут удалены из чата (только локально).',
                    buttons: [
                        { type: 'cancel' },
                        { type: 'ok', text: 'Очистить' }
                    ]
                }, (btn) => {
                    if (btn === 'ok') confirmAction();
                });
            } else {
                if (confirm('Очистить историю чата?')) confirmAction();
            }
        }

        // ----- Обработчики -----
        sendBtn.addEventListener('click', sendMessage);
        inputField.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });
        inputField.addEventListener('input', () => {
            inputField.style.height = 'auto';
            inputField.style.height = inputField.scrollHeight + 'px';
        });

        tipBtn.addEventListener('click', getTip);
        clearBtn.addEventListener('click', clearHistory);

        // Приветствие
        if (initData) {
            addMessage('👋 Привет! Я твой персональный наставник по привычкам. Задай вопрос или расскажи о своих целях.', 'assistant');
        } else {
            addMessage('🔐 Для начала работы откройте это приложение через Telegram.', 'assistant', 'error');
        }

        // Фокус на вводе
        inputField.focus();
    })();
</script>
</body>
</html>
